    const bRun = $('button', 'btn primary', 'Run &amp; check'), bHint = $('button', 'btn ghost', 'Hint'), bReset = $('button', 'btn ghost', 'Reset code'), bSol = $('button', 'btn ghost', 'Show solution');
    [bRun, bHint, bReset, bSol].forEach(b => b.type = 'button');
    acts.append(bRun, bHint, bReset, bSol);
    const hint = $('div', 'hintbox'); hint.innerHTML = '<div>' + esc(t.hint.en) + '</div><div class="ar" dir="rtl">' + esc(t.hint.ar) + '</div>';
    const vb = $('div', 'verdict-box');
    card.append(acts, hint, vb);
    let solArmed = false;
    ed.el.addEventListener('input', () => { drafts[t.id] = ed.get(); });
    bHint.onclick = () => hint.classList.toggle('on');
    bReset.onclick = () => { ed.set(t.starter); drafts[t.id] = t.starter; vb.classList.remove('on'); };
    bSol.onclick = () => {
      if (!solArmed) { solArmed = true; bSol.textContent = 'Tap again to reveal'; setTimeout(() => { solArmed = false; bSol.textContent = 'Show solution'; }, 3500); return; }
      ed.set(t.solution); drafts[t.id] = t.solution; solArmed = false; bSol.textContent = 'Show solution';
    };
    bRun.onclick = () => {
      const code = ed.get(); drafts[t.id] = code;
      const res = EXAMS.checkTask(t, code);
      vb.innerHTML = verdictHTML(t, res); vb.classList.add('on');
      if (res.status === 'error' && res.error.line) ed.mark(res.error.line);
      if (res.status === 'correct') {
        store.add('t:' + t.id); chips.children[k].classList.add('done');
        if (k < tasks.length - 1) { const nx = $('button', 'btn primary', 'Next task'); nx.type = 'button'; nx.style.marginTop = '8px'; nx.onclick = () => { showTask(k + 1); card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; vb.append(nx); }
        else if (chDone(ch) === itemsOf(ch).length) { const p = $('p', 'en', '<b>Chapter complete.</b>'); vb.append(p); }
      }
      vb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
  };
  tasks.forEach((t, k) => { const c = $('button', 'chip' + (store.has('t:' + t.id) ? ' done' : ''), 'Task ' + (k + 1)); c.type = 'button'; c.onclick = () => showTask(k); chips.append(c); });
  showTask(0);
}

/* ------------------------------------------------ MCQ */
function mountQuiz(host, ch) {
  const qs = MCQ[ch]; if (!qs) return;
  const sec = $('section', 'panel'); sec.id = 'quiz';
  sec.innerHTML = '<h2>Quick check</h2><div class="ar-h" dir="rtl">اختبار سريع</div>';
  let score = 0, answered = 0;
  const sc = $('div', 'score');
  qs.forEach((q, qi) => {
    const box = $('div', 'q'); box.append($('h3', null, esc(q.en)));
    const arq = $('div', 'ar-q', esc(q.ar)); arq.dir = 'rtl'; box.append(arq);
    const why = $('div', 'why', '<div>' + esc(q.exEn) + '</div><div class="ar" dir="rtl">' + esc(q.exAr) + '</div>');
    const opts = q.opts.map((o, oi) => {
      const b = $('button', 'opt', esc(o[0]) + '<span>' + esc(o[1]) + '</span>'); b.type = 'button';
      b.onclick = () => {
        opts.forEach(x => x.disabled = true);
        answered++;
        if (oi === q.a) { b.classList.add('right'); score++; } else { b.classList.add('wrong'); opts[q.a].classList.add('right'); }
        why.classList.add('on');
        sc.textContent = 'Score: ' + score + ' / ' + qs.length + (answered === qs.length ? (score === qs.length ? ' — perfect!' : ' — try again for a perfect score') : '');
        if (answered === qs.length && score === qs.length) store.add('q:' + ch);
      };
      box.append(b); return b;
    });
    box.append(why); sec.append(box);
  });
  const retry = $('button', 'btn ghost', 'Try again'); retry.type = 'button';
  retry.onclick = () => { const p = sec.parentNode; sec.remove(); mountQuiz(p, ch); };
  sec.append(sc, retry); host.append(sec);
}

function viewChapter(n) {
  const c = CH.find(x => x.n === n); if (!c) return viewHome();
  clearView();
  document.title = 'Chapter ' + n + ' · ' + c.title[0] + ' — CodeCraft';
  const head = $('section', 'lhead'); const hw = $('div', 'wrap');
  hw.innerHTML = '<div class="crumb">Chapter ' + n + ' of ' + CH.length + '</div><h1>' + esc(c.title[0]) + '</h1><div class="ar-t" dir="rtl">' + esc(c.title[1]) + '</div>' +
    '<p class="en" style="margin-top:14px">' + esc(c.blurb[0]) + '</p><p class="ar" dir="rtl">' + esc(c.blurb[1]) + '</p>';
  const tabs = $('div', 'tabs');
  [['#learn', 'Learn'], ['#lab', 'Watch it move']].concat(MCQ[n] ? [['#quiz', 'Quick check']] : []).concat(TASKS.some(t => t.ch === n) ? [['#exam', 'Code exam']] : []).forEach(t => {
    const b = $('a', 'btn ghost sm', t[1]); b.href = 'javascript:void(0)'; b.onclick = () => { const el = document.querySelector(t[0]); if (el) el.scrollIntoView({ behavior: 'smooth' }); }; tabs.append(b);
  });
  hw.append(tabs); head.append(hw); app.append(head);
  const body = $('div', 'wrap'); body.id = 'learn';
  const prose = $('div', 'prose');
  c.sections.forEach(s => {
    const sec = $('section', 'lsec');
    sec.innerHTML = '<h2>' + esc(s.h[0]) + '</h2><div class="ar-h" dir="rtl">' + esc(s.h[1]) + '</div>';
    s.p.forEach(p => { sec.append($('p', 'en', esc(p[0]))); const a = $('p', 'ar', esc(p[1])); a.dir = 'rtl'; a.lang = 'ar'; sec.append(a); });
    if (s.code) sec.append(codeBlock(s.code, s.note));
    prose.append(sec);
  });
  body.append(prose);
  // lab
  const lab = LABS[c.lab];
  if (lab) {
    const p = $('section', 'panel'); p.id = 'lab';
    p.innerHTML = '<h2>Watch it move</h2><div class="ar-h" dir="rtl">شوفها بتتحرك</div>';
    const box = $('div', 'lab'); box.innerHTML = '<div class="lab-title">' + esc(lab.title[0]) + '<span>' + esc(lab.title[1]) + '</span></div>';
    p.append(box); body.append(p);
    try { lab.make(box); } catch (e) { box.append($('p', 'en', 'The animation could not start: ' + esc(e.message))); }
  }
  mountQuiz(body, n);
  mountExam(body, n);
  // nav
  const nav = $('div', 'chnav');
  const pv = CH.find(x => x.n === n - 1), nx = CH.find(x => x.n === n + 1);
  nav.innerHTML = (pv ? '<a href="#/ch/' + pv.n + '"><small>Previous</small><b>' + pv.n + '. ' + esc(pv.title[0]) + '</b></a>' : '<a href="#/"><small>Back to</small><b>The course map</b></a>') +
    (nx ? '<a class="next" href="#/ch/' + nx.n + '"><small>Next chapter</small><b>' + nx.n + '. ' + esc(nx.title[0]) + '</b></a>' : '<a class="next" href="#/play"><small>You finished the course</small><b>Open the playground</b></a>');
  body.append(nav);
  app.append(body); app.append(footer());
  markDrawer();
}

const PG_SAMPLE = '#include <iostream>\nusing namespace std;\n\nint main() {\n    int a, b;\n    cin >> a >> b;\n    cout << "Sum = " << a + b << endl;\n    return 0;\n}\n';
function viewPlay() {
  clearView();
  document.title = 'Playground — CodeCraft';
  const w = $('div', 'wrap');
  w.innerHTML = '<section class="lhead"><h1>Playground</h1><div class="ar-t" dir="rtl">ملعب الكود</div><p class="en" style="margin-top:14px">Write any C++ you like from this course (variables, if, switch, loops, functions, arrays, strings). Type input values in the box, then run.</p><p class="ar" dir="rtl">اكتب أي كود C++ من المنهج (متغيرات، if، switch، لوبات، دوال، arrays، strings). اكتب قيم الإدخال في الخانة وبعدين شغّل.</p></section>';
  const pg = $('div', 'pg');
  const ed = createEditor(PG_SAMPLE);
  const inp = $('textarea', 'stdin'); inp.placeholder = 'Input for cin (e.g. 3 4)'; inp.value = '3 4';
  const acts = $('div', 'acts'); const bRun = $('button', 'btn primary', 'Run'), bClr = $('button', 'btn ghost', 'Clear'); bRun.type = bClr.type = 'button'; acts.append(bRun, bClr);
  const out = $('div', 'pg-out'); out.textContent = 'Output appears here.';
  bRun.onclick = () => {
    const r = CPP.run(ed.get(), inp.value);
    out.innerHTML = (r.output ? esc(r.output) : '') + (r.ok ? (r.output ? '' : '(no output)') : '');
    if (!r.ok) { out.innerHTML += errHTML(r.error); ed.mark(r.error.line); }
  };
  bClr.onclick = () => { ed.set(''); out.textContent = 'Output appears here.'; };
  pg.append(ed.el, inp, acts, out); w.append(pg); app.append(w); app.append(footer());
}

/* ------------------------------------------------ drawer + router */
const veil = $('div', 'veil'), drawer = $('aside', 'drawer');
drawer.setAttribute('aria-label', 'Chapters');
function buildDrawer() {
  drawer.innerHTML = '<button class="btn ghost sm x" type="button">Close</button><h4>Home</h4><a href="#/"><span class="num">⌂</span>The course map</a><a href="#/play"><span class="num">▶</span>Playground</a>';
  [['A', 'Foundations (1–8)'], ['B', 'C++ (9–15)']].forEach(g => {
    drawer.append($('h4', null, g[1]));
    CH.filter(c => c.group === g[0]).forEach(c => {
      const a = $('a'); a.href = '#/ch/' + c.n; a.dataset.n = c.n;
      a.innerHTML = '<span class="num">' + c.n + '</span><span>' + esc(c.title[0]) + '</span>' + (chDone(c.n) === itemsOf(c.n).length ? '<span class="ok">✓</span>' : '');
      drawer.append(a);
    });
  });
  drawer.querySelector('.x').onclick = closeDrawer;
}
function openDrawer() { buildDrawer(); markDrawer(); veil.classList.add('on'); drawer.classList.add('on'); }
function closeDrawer() { veil.classList.remove('on'); drawer.classList.remove('on'); }
function markDrawer() { const m = /#\/ch\/(\d+)/.exec(location.hash); drawer.querySelectorAll('a').forEach(a => a.classList.toggle('cur', !!m && a.dataset.n === m[1])); }
veil.onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
drawer.addEventListener('click', e => { if (e.target.closest('a')) closeDrawer(); });

function buildTop() {
  const top = $('header', 'top');
  top.innerHTML = '<div class="wrap"><a class="brand" href="#/"><b>C++</b><span>code<em>craft</em></span></a><span class="sp"></span><span class="pill"><span class="bar"><i></i></span><span class="lbl"></span></span><a class="nav-btn" href="#/play">Playground</a><button class="nav-btn" type="button" id="menuBtn">Chapters</button></div>';
  document.body.prepend(top);
  document.body.append(veil, drawer);
  top.querySelector('#menuBtn').onclick = openDrawer;
}

function route() {
  closeDrawer();
  const h = location.hash;
  document.title = 'CodeCraft — learn C++ chapter by chapter';
  let m;
  if ((m = /^#\/ch\/(\d+)/.exec(h))) viewChapter(+m[1]);
  else if (h === '#/play') viewPlay();
  else viewHome();
  refreshProgress();
}

/* ------------------------------------------------ boot */
buildTop();
window.addEventListener('hashchange', route);
route();
window.__app = { route, store };
})();
