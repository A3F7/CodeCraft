:root{
  --bg:#0a0f0e; --bg2:#0e1513; --card:#111816; --card2:#151e1b; --line:#243029; --txt:#e9efe9; --mut:#84928a; --soft:#aeb9b1;
  --lime:#c7fb68; --lime2:#a8dd51; --limehi:#dcff9a; --cyan:#82dcd1; --violet:#ab9cff; --blue:#85b8ff; --ok:#a8dd51; --coral:#FF6B81; --orange:#FF9F6B;
  --ar:#d5dfd2; --r:12px;
  --display:'Space Grotesk','IBM Plex Sans Arabic',system-ui,sans-serif; --body:'DM Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'DM Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.7;color:var(--txt);background:var(--bg);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(900px 520px at 85% -5%,rgba(199,251,104,.07),transparent 60%),radial-gradient(800px 600px at -10% 45%,rgba(130,220,209,.05),transparent 60%);background-attachment:fixed}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:6px}
::selection{background:var(--lime);color:#0a1405}
.wrap{width:min(100% - 32px,1040px);margin-inline:auto}
.prose{max-width:780px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;letter-spacing:-.025em}
[dir=rtl]{font-family:var(--body)}
.sr{position:absolute;left:-9999px}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:50;background:rgba(10,15,14,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(233,255,240,.09)}
.top .wrap{display:flex;align-items:center;gap:10px;height:62px}
.brand{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand em{font-style:normal;color:var(--lime)}
.brand b{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid rgba(199,251,104,.45);color:var(--lime);font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:-.04em}
.top .sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);white-space:nowrap}
.pill .bar{width:84px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.pill .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--ok));width:0;transition:width .6s}
.nav-btn{background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:7px 13px;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.nav-btn:hover{border-color:var(--lime);color:var(--limehi)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,border-color .15s,background .15s}
.btn:hover{border-color:var(--lime);transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn.primary{box-shadow:0 8px 24px -10px rgba(199,251,104,.55);background:linear-gradient(135deg,var(--lime),#a8dd51);color:#0a1405;border-color:transparent}
.btn.primary:hover{background:linear-gradient(135deg,var(--limehi),var(--lime))}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.on{border-color:var(--lime);background:rgba(199,251,104,.14);color:var(--limehi)}
.btn[disabled]{opacity:.4;cursor:default;transform:none;border-color:var(--line)}

/* ---- drawer ---- */
.veil{position:fixed;inset:0;background:rgba(3,6,5,.6);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,92vw);background:var(--bg2);border-right:1px solid var(--line);z-index:61;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:18px}
.drawer.on{transform:none}
.drawer h4{font-size:13px;color:var(--mut);margin:18px 0 8px;font-family:var(--body);font-weight:700}
.drawer a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none;font-size:15px;line-height:1.35}
.drawer a:hover,.drawer a.cur{background:var(--card2)}
.drawer a .num{font-family:var(--display);font-size:13px;color:var(--lime);min-width:26px}
.drawer a .ok{margin-left:auto;color:var(--ok);font-weight:700}
.drawer .x{float:right}

/* ---- hero ---- */
.hero{position:relative;min-height:calc(100vh - 62px);min-height:calc(100svh - 62px);display:flex;align-items:center;overflow:hidden}
.hero .wrap{position:relative;z-index:1;padding:40px 0 60px}
.hero h1{font-size:clamp(34px,5.4vw,52px);max-width:12em;text-wrap:balance;font-weight:600;letter-spacing:-.035em}
.hero .sub{max-width:520px;margin-top:22px;font-size:18px;color:#aeb9b1}
.hero .sub-ar{max-width:520px;margin-top:10px;font-size:18px;color:var(--ar);border-right:3px solid var(--lime);padding:4px 14px 4px 0;direction:rtl;text-align:right}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .fallback{position:absolute;inset:0;display:none}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.rise.d1{animation-delay:.12s}.rise.d2{animation-delay:.24s}.rise.d3{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* ---- map ---- */
.sec{padding:70px 0 20px}
.sec h2{font-size:clamp(24px,3.4vw,36px)}
.sec .ar-h{font-size:21px;color:var(--ar);margin-top:6px;direction:rtl;text-align:right;font-weight:700}
.group{margin-top:42px}
.group h3{font-size:18px;margin-bottom:4px}
.group .ar-h{font-size:17px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px;margin-top:20px;perspective:1100px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;text-decoration:none;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;min-height:210px;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .18s ease-out,border-color .2s,box-shadow .2s;will-change:transform}
.card:hover{border-color:var(--lime);box-shadow:0 22px 40px -18px rgba(0,0,0,.7),0 0 0 1px rgba(199,251,104,.25)}
.card .n{font-family:var(--display);font-size:50px;font-weight:700;line-height:1;color:var(--lime);transform:translateZ(34px);text-shadow:0 8px 18px rgba(0,0,0,.45)}
.card .t{font-weight:700;font-size:16px;line-height:1.35;transform:translateZ(18px)}
.card .ta{font-size:15px;color:var(--ar);direction:rtl;text-align:right;transform:translateZ(12px)}
.card .meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mut);transform:translateZ(10px)}
.card .meta .pr{display:flex;align-items:center;gap:6px}
.card .meta .pr i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.card .meta .pr i.d{background:var(--ok)}
.card.full{border-color:rgba(168,221,81,.55)}

/* ---- lesson ---- */
.lhead{padding:50px 0 12px}
.lhead .crumb{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin-bottom:12px}
.lhead h1{font-size:clamp(26px,4.4vw,46px);max-width:18em;text-wrap:balance}
.lhead .ar-t{font-size:clamp(20px,2.8vw,28px);color:var(--ar);margin-top:12px;direction:rtl;text-align:right;font-weight:700}
.tabs{display:flex;gap:10px;margin:26px 0 8px;flex-wrap:wrap}
.lsec{margin-top:46px}
.lsec h2{font-size:clamp(20px,2.6vw,27px)}
.lsec .ar-h{font-size:19px;color:var(--ar);margin:4px 0 14px;direction:rtl;text-align:right;font-weight:700}
.en{margin:0 0 6px;max-width:780px}
.ar{direction:rtl;text-align:right;font-size:17.5px;line-height:1.95;color:var(--ar);margin:0 0 22px;padding:8px 16px 8px 4px;border-right:3px solid var(--lime);background:linear-gradient(270deg,rgba(199,251,104,.08),transparent);max-width:780px;border-radius:0 8px 8px 0}
.note{font-size:14px;color:var(--mut);margin:8px 0 0}
.note-ar{font-size:14px;color:#9fb09e;direction:rtl;text-align:right;margin:2px 0 0}

/* ---- code ---- */
.cb{margin:18px 0 6px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#070b0a;max-width:820px}
.cb-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#121a17;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:var(--mut)}
.cb-h .sp{flex:1}
.cb pre.code{margin:0;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:14px;line-height:22px;tab-size:4;direction:ltr;text-align:left}
.cb-in{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:#0c1210;direction:ltr}
.cb-in label{font-size:12.5px;color:var(--mut);font-family:var(--mono)}
.cb-in input{flex:1;min-width:0;background:#070b0a;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:6px 10px;font-family:var(--mono);font-size:14px}
.cb-out{display:none;padding:12px 16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:14px;white-space:pre-wrap;direction:ltr;text-align:left;background:#050908}
.cb-out.on{display:block}
.cb-out .e1{color:var(--coral)} .cb-out .e2{color:#ffc2cb;direction:rtl;display:block;text-align:right;font-family:var(--body);margin-top:4px}
.tk-c{color:#6f8077;font-style:italic}.tk-s{color:#c7fb68}.tk-p{color:#ab9cff}.tk-n{color:var(--orange)}.tk-k{color:var(--lime)}.tk-t{color:var(--cyan)}.tk-f{color:#85b8ff}

/* editor */
.ed{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#070b0a;height:min(56vh,380px);min-height:260px;direction:ltr}
.ed .gut{width:44px;flex:none;background:#0c1210;color:#5d6d64;font-family:var(--mono);font-size:13px;line-height:22px;padding:14px 8px;text-align:right;overflow:hidden;user-select:none;white-space:pre}
.ed .stack{position:relative;flex:1;min-width:0}
.ed pre.hl,.ed textarea{position:absolute;inset:0;margin:0;padding:14px 16px;border:0;font-family:var(--mono);font-size:14px;line-height:22px;tab-size:4;white-space:pre;word-wrap:normal;overflow:auto;letter-spacing:0}
.ed pre.hl{overflow:hidden;pointer-events:none;color:var(--txt)}
.ed textarea{resize:none;background:transparent;color:transparent;caret-color:var(--lime);outline:none;-webkit-text-fill-color:transparent}
.ed .errbar{position:absolute;left:0;right:0;height:22px;background:rgba(255,107,129,.18);border-left:3px solid var(--coral);display:none}

/* ---- lab ---- */
.panel{margin-top:46px;scroll-margin-top:80px}
.panel > h2{font-size:clamp(20px,2.6vw,27px)}
.panel .ar-h{font-size:19px;color:var(--ar);margin:4px 0 14px;direction:rtl;text-align:right;font-weight:700}
.lab{background:linear-gradient(170deg,#111816,#0d1311);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.lab-title{font-weight:700;font-size:15px;color:var(--limehi);margin-bottom:14px}
.lab-title span{display:block;color:var(--ar);font-size:14px;direction:rtl;text-align:right}
.stage{position:relative;background:#0b1110;border:1px solid rgba(233,255,240,.09);border-radius:10px;padding:18px;overflow:hidden;min-height:150px;direction:ltr}
.cap{margin-top:14px;min-height:96px}
.cap-en{margin:0 0 6px;font-size:16.5px;line-height:1.55}
.cap-ar{margin:0;font-size:16.5px;line-height:1.8;color:var(--ar);border-right:3px solid var(--lime);padding-right:12px}
.cap b{color:var(--limehi)}
.lab-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.dot{width:12px;height:12px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0;transition:transform .2s,background .2s}
.dot.past{background:#3d5247}.dot.on{background:var(--lime);transform:scale(1.35)}
.variants{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}

/* lab: binary search */
.bs-target{font-size:15px;color:var(--mut);margin-bottom:12px}.bs-target b{color:var(--limehi)}
.bs-row{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.bs-cell{aspect-ratio:1/1.15;display:grid;place-items:center;border-radius:8px;background:#16201d;border:1px solid var(--line);font-family:var(--mono);font-size:clamp(9px,1.8vw,15px);transition:all .5s}
.bs-cell.out{opacity:.18;transform:scale(.86);background:#0c1311}
.bs-cell.mid{background:var(--lime);color:#0a1405;transform:translateY(-8px) scale(1.08);box-shadow:0 10px 24px -8px rgba(199,251,104,.7)}
.bs-cell.found{background:var(--ok);color:#0a1405;transform:translateY(-8px) scale(1.12);box-shadow:0 10px 26px -6px rgba(168,221,81,.8)}
/* timeline */
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;padding-top:34px}
.tl-key{position:absolute;top:10px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.tl-item{text-align:center;transition:opacity .5s,transform .5s;opacity:.35}
.tl-item.past{opacity:.7}.tl-item.on{opacity:1;transform:translateY(-6px)}
.tl-box{height:130px;display:flex;align-items:flex-end;justify-content:center}
.tl-box i{display:block;width:var(--s);height:var(--s);max-width:100%;border-radius:8px;background:linear-gradient(145deg,var(--cyan),#4f8be0);transition:background .4s}
.tl-item.on .tl-box i{background:linear-gradient(145deg,var(--limehi),var(--lime))}
.tl-y{font-family:var(--mono);font-size:12px;margin-top:8px;color:var(--limehi)}
.tl-n{font-size:12.5px;line-height:1.25;min-height:32px}
.tl-p{height:5px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}.tl-p b{display:block;height:100%;width:var(--p);background:var(--ok)}
/* cpu */
.cpu{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;gap:0;min-height:230px}
.cpu-box,.ram-box{border:1px solid var(--line);border-radius:10px;padding:14px;background:#151e1b;transition:box-shadow .4s,border-color .4s}
.cpu-box.hot,.ram-box.hot{border-color:var(--lime);box-shadow:0 0 0 3px rgba(199,251,104,.2),0 0 30px -4px rgba(199,251,104,.45)}
.cpu h4,.ram-box h4{font-size:14px;margin-bottom:10px;color:var(--limehi)}
.reg{font-family:var(--mono);font-size:14px;padding:6px 10px;border-radius:8px;background:#0b1110;margin-top:6px;display:flex;justify-content:space-between}
.reg b{color:var(--ok)}
.ram-box .cell{font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:8px;background:#0b1110;margin-top:6px;border:1px solid transparent;transition:all .4s}
.ram-box .cell.act{border-color:var(--lime);background:#1e2a14}
.ram-box .cell b{color:var(--ok)}
.bus{position:relative;height:6px;margin:0 8px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px);border-radius:4px}
.pkt{position:absolute;top:-9px;width:24px;height:24px;border-radius:7px;background:var(--lime);box-shadow:0 0 18px var(--lime);transition:left .9s cubic-bezier(.5,0,.2,1)}
.pkt.at-ram{left:calc(100% - 24px)}.pkt.at-cpu{left:0}
/* bits */
.bit-row{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.bit{border:1px solid var(--line);background:#151e1b;color:var(--txt);border-radius:12px;padding:8px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .25s;font-family:var(--mono)}
.bit small{font-size:11px;color:var(--mut)}.bit span{font-size:clamp(20px,4vw,30px);font-weight:700}
.bit.on{background:var(--lime);color:#0a1405;border-color:var(--lime);transform:translateY(-4px);box-shadow:0 12px 24px -10px rgba(199,251,104,.7)}.bit.on small{color:#3a5410}
.bit-out{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.bit-out div{background:#151e1b;border-radius:12px;padding:10px 12px;text-align:center}
.bit-out small{display:block;font-size:12px;color:var(--mut)}.bit-out b{font-family:var(--mono);font-size:clamp(14px,3vw,22px);color:var(--ok);word-break:break-all}
.bit-presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* scheduler */
.sch{display:grid;gap:14px}
.sch-cpu{display:flex;align-items:center;gap:14px;font-family:var(--mono)}
.sch-cpu small{color:var(--mut)}.sch-cpu b{padding:8px 18px;border-radius:10px;background:#151e1b;border:1px solid var(--lime);color:var(--limehi);min-width:120px;text-align:center}
.sch-procs{display:grid;gap:8px}
.sch-p{display:flex;align-items:center;gap:12px;font-size:14px}
.sch-p span{width:70px}
.sch-p .bar{flex:1;height:12px;border-radius:8px;background:#151e1b;overflow:hidden}
.sch-p .bar i{display:block;height:100%;width:0;transition:width .7s;background:var(--cyan)}
.sch-p.c2 .bar i{background:var(--lime)}.sch-p.c3 .bar i{background:var(--ok)}
.sch-p.run span{color:var(--limehi);font-weight:700}
.sch-tl{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.slot{height:34px;border-radius:7px;background:#151e1b;display:grid;place-items:center;font-weight:700;font-size:13px;color:#0a1405;transition:background .3s,transform .3s}
.slot.full{transform:scale(1)}.slot.c1{background:var(--cyan)}.slot.c2{background:var(--lime)}.slot.c3{background:var(--ok)}
/* trace */
.trace{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.tr-code{background:#060a09;border-radius:12px;padding:10px 0;font-family:var(--mono);font-size:13.5px;overflow:auto}
.tr-line{display:flex;align-items:center;gap:10px;padding:2px 12px 2px 8px;border-left:3px solid transparent;transition:background .3s,border-color .3s;white-space:pre}
.tr-line i{color:#5d6d64;width:20px;text-align:right;font-style:normal;font-size:12px}
.tr-line code{flex:1;font-family:var(--mono)}
.tr-line.act{background:rgba(199,251,104,.15);border-left-color:var(--lime)}
.tag{font-style:normal;font-family:var(--body);font-size:11px;padding:1px 8px;border-radius:18px;background:#1d2b25;color:var(--cyan);margin-left:auto}
.tag.selection{background:#2a2650;color:var(--violet)}
.tr-side{display:grid;gap:12px;align-content:start}
.tr-vars{display:flex;gap:8px;flex-wrap:wrap}
.v{background:#151e1b;border:1px solid var(--line);border-radius:12px;padding:6px 14px;text-align:center;min-width:76px}
.v small{display:block;font-size:12px;color:var(--mut);font-family:var(--mono)}.v b{font-family:var(--mono);font-size:22px;color:var(--ok)}
.v.ch{animation:flash .8s}
@keyframes flash{0%{background:var(--lime);transform:scale(1.12)}100%{background:#151e1b;transform:none}}
.tr-con{background:#040706;border-radius:12px;padding:10px 14px;min-height:80px}
.tr-con small{font-size:12px;color:var(--mut);font-family:var(--mono)}
.tr-con pre{margin:4px 0 0;font-family:var(--mono);font-size:14px;color:#dfffa8;white-space:pre-wrap}
.cur{display:inline-block;width:8px;height:15px;background:var(--ok);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* memory */
.mem-code{font-family:var(--mono);font-size:16px;color:var(--limehi);margin-bottom:14px;min-height:26px}
.mem-strip{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.mc{position:relative;aspect-ratio:1/1.4;background:#151e1b;border-radius:6px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;transition:all .5s}
.mc small{font-size:clamp(7px,1.3vw,10px);color:#6b7a72;font-family:var(--mono)}
.mc b{position:absolute;top:6px;left:4px;font-family:var(--mono);font-size:clamp(9px,1.6vw,13px);color:#0a1405;white-space:nowrap;z-index:2}
.mc.used{color:#0a1405}.mc.used small{color:rgba(10,20,5,.7)}
.mc.c1{background:var(--cyan)}.mc.c2{background:var(--ok)}.mc.c3{background:var(--lime)}.mc.c4{background:var(--orange)}
.mc.join{border-right-color:transparent;border-top-right-radius:0;border-bottom-right-radius:0}
.mc.new{animation:pop .6s}
@keyframes pop{0%{transform:translateY(-14px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
/* expr */
.expr{display:grid;place-items:center;min-height:130px}
.expr-show{font-family:var(--mono);font-size:clamp(26px,6vw,52px);letter-spacing:.04em}
.expr-show mark{background:var(--lime);color:#0a1405;border-radius:10px;padding:0 10px;animation:pop .5s}
/* ladder */
.lad-in{display:flex;align-items:center;gap:16px;margin-bottom:16px;font-family:var(--mono)}
.lad-in b{color:var(--limehi);font-size:22px;display:inline-block;min-width:3ch}
.lad-in input{flex:1;accent-color:var(--lime);height:30px}
.rungs{display:grid;gap:8px}
.rung{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:#151e1b;border:1px solid var(--line);transition:all .35s;font-family:var(--mono);font-size:14px}
.rung code{flex:1}
.rung .res{font-family:var(--body);font-weight:700;color:var(--mut)}
.rung .verdict{font-size:12px;min-width:50px;text-align:right;color:var(--mut)}
.rung.check{background:#1c2824}
.rung.miss{border-color:rgba(255,107,129,.6)}.rung.miss .verdict{color:var(--coral)}
.rung.win{background:#18301a;border-color:var(--ok);box-shadow:0 0 28px -6px rgba(168,221,81,.6);transform:translateX(8px)}.rung.win .verdict,.rung.win .res{color:var(--ok)}
.rung.skipped{opacity:.3}
/* call stack */
.cs{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;min-height:260px}
.cs-code code{display:block;font-family:var(--mono);font-size:13.5px;background:#060a09;padding:12px;border-radius:12px;line-height:1.6}
.cs-call{margin-top:12px;font-family:var(--mono);color:var(--limehi)}
.cs-stack{display:flex;flex-direction:column-reverse;gap:6px;justify-content:flex-start;align-self:stretch;position:relative}
.cs-ret{position:absolute;right:18px;bottom:16px;font-family:var(--mono);color:var(--ok);opacity:0;transition:opacity .4s;font-size:13px}.cs-ret.on{opacity:1}
.fr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;background:#151e1b;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:var(--mono);font-size:13px;max-height:0;opacity:0;padding-block:0;border-width:0;overflow:hidden;transform:translateY(-16px);transition:all .5s}
.fr.in{max-height:90px;opacity:1;padding-block:8px;border-width:1px;transform:none}
.fr.top{border-color:var(--lime);background:#1e2a14}
.fr em{grid-column:1/-1;font-style:normal;color:var(--ok);font-size:12px}
.fr span{color:var(--mut)}
/* stack/queue */
.sq{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
.sq-box{background:#151e1b;border-radius:10px;padding:14px;border:1px solid var(--line)}
.sq-box h4{font-size:14px;margin-bottom:10px;color:var(--limehi)}.sq-box h4 small{color:var(--mut);font-family:var(--body);font-weight:400}
.sq-stack{display:flex;flex-direction:column-reverse;gap:5px;min-height:230px;justify-content:flex-start;align-items:center;border-bottom:3px solid var(--line)}
.sq-queue{display:flex;gap:5px;min-height:56px;align-items:center;border-bottom:3px solid var(--line);padding-bottom:6px;overflow:hidden}
.sq .it{min-width:56px;height:36px;display:grid;place-items:center;border-radius:8px;background:var(--cyan);color:#0a1405;font-weight:700;font-family:var(--mono);animation:pop .4s}
.sq-stack .it{width:70%}
.sq .it.top,.sq .it.front{background:var(--lime)}
.sq .empty{color:var(--mut);font-size:13px;align-self:center}
.sq-btns{display:flex;gap:8px;margin-top:12px}
/* network */
.net{height:210px}
.net-line{position:absolute;left:8%;right:8%;top:84px;height:4px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px)}
.node{position:absolute;top:60px;width:0;text-align:center}
.node i{position:absolute;left:-20px;top:0;width:40px;height:40px;border-radius:12px;background:#151e1b;border:2px solid var(--line);transition:all .4s}
.node span{position:absolute;left:-40px;width:80px;top:50px;font-size:12px;color:var(--mut)}
.node.act i{border-color:var(--lime);box-shadow:0 0 22px rgba(199,251,104,.6);background:#1e2a14}
.node.n0{left:8%}.node.n1{left:36%}.node.n2{left:64%}.node.n3{left:92%}
.pk{position:absolute;width:24px;height:24px;border-radius:6px;background:var(--cyan);color:#0a1405;font-weight:700;font-size:13px;display:grid;place-items:center;transition:all .9s cubic-bezier(.5,0,.2,1);top:72px}
.pk.p2{background:var(--lime)}.pk.p3{background:var(--ok)}.pk.p4{background:var(--orange)}
.pk.hide{opacity:0}
.net-dns{position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-8px);font-family:var(--mono);font-size:13px;background:#1c2824;border:1px solid var(--lime);border-radius:10px;padding:6px 14px;opacity:0;transition:all .5s;white-space:nowrap}
.net-dns.on{opacity:1;transform:translateX(-50%)}
.net-msg{position:absolute;right:6%;bottom:12px;font-family:var(--mono);font-size:13px;color:var(--ok);opacity:0;transition:opacity .5s}.net-msg.on{opacity:1}

/* ---- exam ---- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:30px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--lime);background:rgba(199,251,104,.14);color:var(--limehi)}
.chip.done::after{content:'✓';color:var(--ok);font-weight:700}
.task{background:linear-gradient(170deg,#111816,#0d1311);border:1px solid var(--line);border-radius:18px;padding:20px}
.task h3{font-size:19px;margin-bottom:10px}
.task .en,.task .ar{white-space:pre-line}
.task .ar{margin-bottom:16px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.hintbox{display:none;margin:0 0 14px;padding:12px 16px;border-radius:12px;background:rgba(130,220,209,.1);border:1px solid rgba(130,220,209,.4);font-size:15px}
.hintbox.on{display:block}
.hintbox .ar{margin:6px 0 0;font-size:16px;border-color:var(--cyan);background:none}
.verdict-box{display:none;margin-top:6px}
.verdict-box.on{display:block}
.stamp{display:inline-block;font-family:var(--display);font-weight:700;font-size:clamp(22px,4.5vw,34px);padding:6px 20px;border-radius:12px;border:3px solid;transform:rotate(-3deg);animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both;margin-bottom:12px}
.stamp.ok{color:var(--ok);border-color:var(--ok);background:rgba(168,221,81,.1)}
.stamp.bad{color:var(--coral);border-color:var(--coral);background:rgba(255,107,129,.1)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-3deg);opacity:1}}
.vmsg{margin:4px 0 10px}.vmsg .en{margin:0}.vmsg .ar{margin:4px 0 10px;font-size:16.5px}
.errbox{background:#1b1030;border:1px solid rgba(255,107,129,.5);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.errbox .l{font-family:var(--mono);color:var(--coral);font-size:13px;margin-bottom:4px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.cmp div{background:#060a09;border-radius:10px;padding:8px 12px;min-width:0}
.cmp small{display:block;color:var(--mut);font-size:12px}
.cmp pre{margin:2px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-word;color:var(--txt)}
.cmp .exp pre{color:var(--ok)}.cmp .got pre{color:var(--coral)}
.reqs{list-style:none;padding:0;margin:8px 0}
.reqs li{display:flex;gap:10px;padding:8px 12px;border-radius:10px;background:#151e1b;margin-bottom:6px;font-size:15px}
.reqs li.no{border:1px solid rgba(255,107,129,.5)}
.reqs li b{flex:none;width:20px}
.reqs li.yes b{color:var(--ok)}.reqs li.no b{color:var(--coral)}
.reqs li div span{display:block;color:var(--ar);direction:rtl;text-align:right;font-size:14px}

/* ---- MCQ ---- */
.q{background:linear-gradient(170deg,#111816,#0d1311);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.q h3{font-family:var(--body);font-size:17px;font-weight:700;margin-bottom:2px}
.q .ar-q{color:var(--ar);direction:rtl;text-align:right;margin-bottom:12px;font-size:16px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#151e1b;color:var(--txt);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:16px;line-height:1.45;transition:all .2s}
.opt span{display:block;color:var(--ar);direction:rtl;text-align:right;font-size:14.5px}
.opt:hover:not([disabled]){border-color:var(--lime);transform:translateX(4px)}
.opt.right{background:#18301a;border-color:var(--ok)}.opt.wrong{background:#4a1a35;border-color:var(--coral);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.why{display:none;margin-top:8px;font-size:15px;padding:10px 14px;border-radius:10px;background:rgba(168,221,81,.09)}
.why.on{display:block}
.why .ar{margin:4px 0 0;font-size:15px;padding:0 10px 0 0;background:none}
.score{font-weight:700;color:var(--limehi);margin:10px 0}

/* ---- playground ---- */
.pg{display:grid;gap:14px;margin-top:20px}
.pg textarea.stdin{width:100%;min-height:70px;background:#070b0a;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:10px 14px;font-family:var(--mono);font-size:14px;direction:ltr}
.pg-out{background:#040706;border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:100px;font-family:var(--mono);font-size:14px;white-space:pre-wrap;direction:ltr}

/* ---- chapter nav ---- */
.chnav{display:flex;gap:14px;margin:60px 0 10px;flex-wrap:wrap}
.chnav a{flex:1;min-width:230px;text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px 20px;transition:all .2s}
.chnav a:hover{border-color:var(--lime);transform:translateY(-3px)}
.chnav small{color:var(--mut);display:block}.chnav b{font-size:16px}
.chnav a.next{text-align:right}

/* ---- footer ---- */
.foot{margin-top:90px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,rgba(10,15,14,.9));padding:46px 0 30px;text-align:center}
.foot .by{font-family:var(--display);font-size:clamp(17px,2.6vw,24px);font-weight:600}
.foot .by-ar{font-size:19px;color:var(--ar);margin-top:6px;direction:rtl}
.foot .sig{margin:26px auto 0;display:block;width:min(240px,60vw);height:auto;filter:drop-shadow(0 6px 18px rgba(199,251,104,.35))}
.foot .sig-line{width:min(300px,70vw);height:1px;margin:2px auto 0;background:linear-gradient(90deg,transparent,var(--lime),transparent)}

/* ---- responsive ---- */
@media (max-width:760px){
  body{font-size:16.5px}
  .pill .bar{display:none}
  .top .wrap{gap:6px}.brand{font-size:15px}.nav-btn{padding:6px 10px;font-size:13px}
  .trace,.cs,.sq{grid-template-columns:1fr}
  .cpu{grid-template-columns:1fr;gap:10px}.bus{height:46px;background:none}.pkt{display:none}
  .cmp{grid-template-columns:1fr}
  .tl{grid-template-columns:repeat(3,1fr);row-gap:20px}
  .bit-out{grid-template-columns:repeat(2,1fr)}
  .bs-row{grid-template-columns:repeat(8,1fr)}
  .hero{align-items:flex-end}
  .lab{padding:14px}.stage{padding:12px}
  .sch-tl{grid-template-columns:repeat(9,1fr)}
  .chnav a.next{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

.card .n{font-weight:500;letter-spacing:-.04em}
.foot .sig{filter:drop-shadow(0 6px 18px rgba(199,251,104,.28))}

/* ---- hero art (CSS 3D) ---- */
.hero{background-image:linear-gradient(rgba(233,255,240,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(233,255,240,.04) 1px,transparent 1px);background-size:44px 44px;background-position:center}
.hero .wrap{pointer-events:none}.hero .wrap a,.hero .wrap p,.hero .wrap h1{pointer-events:auto}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:42%;perspective:850px;z-index:0;pointer-events:none;display:grid;place-items:center}
.hero-art>*{position:absolute}
.art-glow{width:220px;height:220px;border-radius:50%;background:rgba(199,251,104,.32);filter:blur(50px);animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
.hero-art:hover .art-glow{filter:blur(46px)}
.orbit{border:1px solid rgba(233,255,240,.12);border-radius:50%}
.orbit.o1{width:295px;height:115px;--a:-24deg;animation:orbit-turn 18s linear infinite}
.orbit.o2{width:235px;height:86px;--a:32deg;animation:orbit-turn-reverse 22s linear infinite}
.orbit .d{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime)}
.orbit .d.a{left:50%;top:-4px;margin-left:-3px}
.orbit .d.b{right:-4px;top:50%;margin-top:-3px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.orbit .d.c{left:14%;bottom:12%;background:var(--violet);box-shadow:0 0 12px var(--violet);width:5px;height:5px}
@keyframes orbit-turn{from{transform:rotate(var(--a))}to{transform:rotate(calc(var(--a) + 360deg))}}
@keyframes orbit-turn-reverse{from{transform:rotate(var(--a))}to{transform:rotate(calc(var(--a) - 360deg))}}
.hero-cube{width:138px;height:138px;transform-style:preserve-3d;transform:rotateX(-27deg) rotateY(37deg);animation:cube-hover 7s ease-in-out infinite}
@keyframes cube-hover{0%,100%{transform:translateY(0) rotateX(-27deg) rotateY(37deg)}50%{transform:translateY(-8px) rotateX(-22deg) rotateY(43deg)}}
.cube-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid rgba(199,251,104,.4);border-radius:6px;font-family:var(--mono);color:var(--text,#e9efe9);box-shadow:inset 0 0 26px rgba(199,251,104,.1);backface-visibility:hidden}
.cube-face b{font-family:var(--display);font-size:34px;font-weight:500;color:var(--lime);letter-spacing:-.04em}
.cube-face span{font-size:11px;letter-spacing:.2em;color:var(--soft)}
.f-front{transform:translateZ(69px);background:linear-gradient(145deg,#1b2a22,#0f1a15)}
.f-side{transform:rotateY(90deg) translateZ(69px);background:linear-gradient(145deg,#142019,#0b1410)}
.f-top{transform:rotateX(90deg) translateZ(69px);background:linear-gradient(145deg,#1f1d3a,#101a16)}
.f-top b{color:var(--violet);font-size:30px}
.float-chip{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:rgba(7,11,10,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:chip-float 5.5s ease-in-out infinite;white-space:nowrap}
@keyframes chip-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.chip-code{left:8%;top:22%;font-family:var(--mono);font-size:13px}
.chip-code .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.chip-code code{font-family:var(--mono)}
.chip-flow{right:6%;bottom:24%;animation-delay:-2.2s}
.chip-flow .n{font-family:var(--mono);font-size:12px;color:var(--lime)}
.chip-flow b{display:block;font-size:13px;font-weight:600}
.chip-flow small{display:block;font-size:11px;color:var(--mut)}
.chip-flow .ck{font-style:normal;color:#0a1405;background:var(--lime);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.art-caption{bottom:9%;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:8px;white-space:nowrap}
.art-caption i{width:26px;height:2px;background:var(--lime);border-radius:2px}
.hero-index{position:absolute;right:24px;top:22px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--mut);z-index:1}
@media (max-width:1100px){.hero-art{width:46%}.orbit.o1{transform-origin:center;scale:.85}.chip-code{left:2%}}
@media (max-width:860px){
  .hero{flex-direction:column;align-items:stretch}
  .hero .wrap{padding-bottom:10px}
  .hero-art{position:relative;width:100%;height:340px;flex:none}
  .hero-cube{scale:.85}.orbit{scale:.8}.hero-index{right:16px}
}
@media (max-width:420px){.chip-flow{right:2%}.chip-code{left:0;top:12%}.hero-art{height:300px}}

/* ---- curriculum map + why + footer (CodeCraft) ---- */
.sec.curric{padding:80px 0 10px}
.cur-head{max-width:760px;margin-inline-start:auto;text-align:right}
.eyebrow{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--lime);margin-bottom:12px}
.cur-head h2{font-size:clamp(26px,3.6vw,38px);font-weight:600;font-family:var(--display);letter-spacing:-.02em;line-height:1.3}
.cur-head .ar-p,.feat .ar-p{color:var(--soft);font-size:15.5px;line-height:1.9;margin:12px 0 0;direction:rtl;text-align:right}
.cur-head .en-p,.feat .en-p{color:var(--mut);font-size:13.5px;line-height:1.6;margin:6px 0 0;text-align:left}
.cur-filters{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 22px}
.cur-tab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:30px;padding:8px 16px;font-size:13.5px;cursor:pointer;transition:all .2s}
.cur-tab .dotk{width:6px;height:6px;border-radius:50%;background:var(--line)}
.cur-tab:hover{border-color:rgba(199,251,104,.5);color:var(--txt)}
.cur-tab.on{border-color:rgba(199,251,104,.55);background:rgba(199,251,104,.1);color:var(--lime)}
.cur-tab.on .dotk{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.cur-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cur-card{display:flex;flex-direction:column;gap:8px;padding:16px;min-height:178px;text-decoration:none;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,#131c18,#0e1512);transition:transform .2s,border-color .2s,box-shadow .2s}
.cur-card[hidden]{display:none}
.cur-card:hover{transform:translateY(-4px);border-color:rgba(199,251,104,.5);box-shadow:0 18px 36px -20px rgba(199,251,104,.35)}
.cur-card.full{border-color:rgba(199,251,104,.4)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;direction:rtl}
.cc-n{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--txt)}
.cc-st{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.cc-st.done{color:var(--lime);border-color:rgba(199,251,104,.45);background:rgba(199,251,104,.08)}
.cc-st.prog{color:var(--cyan);border-color:rgba(130,220,209,.4)}
.cc-t{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.3;letter-spacing:-.01em;text-align:right}
.cc-ta{font-size:12.5px;color:var(--mut);text-align:right}
.cc-lab{margin-top:auto;padding-top:10px;border-top:1px solid rgba(233,255,240,.07);display:flex;flex-direction:column;gap:6px}
.cc-lab span{font-family:var(--mono);font-size:11px;color:var(--lime);letter-spacing:.02em;text-align:right;direction:ltr}
.cc-bar{display:block;height:2px;border-radius:2px;background:rgba(233,255,240,.08);overflow:hidden}
.cc-bar b{display:block;height:100%;background:var(--lime)}
.why-sec{margin-top:96px}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.feat{padding:22px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,#131c18,#0e1512)}
.feat-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--lime);background:rgba(199,251,104,.08);border:1px solid rgba(199,251,104,.3);margin-bottom:14px}
.feat h3{font-family:var(--display);font-size:16px;font-weight:600;text-align:right;direction:rtl;letter-spacing:-.01em}
.foot{margin-top:100px;padding:54px 0 30px}
.foot-logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.02em}
.foot-logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid rgba(199,251,104,.45);color:var(--lime);font-family:var(--mono);font-size:12px;font-weight:500}
.foot-logo em{font-style:normal;color:var(--lime)}
.foot-tag{max-width:520px;margin:16px auto 0;color:var(--soft);font-size:14.5px;line-height:1.9}
.foot-tag-en{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mut);margin-top:10px}
@media (max-width:1000px){.cur-grid{grid-template-columns:repeat(3,1fr)}.feat-grid{grid-template-columns:1fr}}
@media (max-width:700px){.cur-grid{grid-template-columns:repeat(2,1fr);gap:10px}.cur-card{min-height:160px;padding:13px}.cc-n{font-size:28px}}
@media (max-width:390px){.cur-grid{grid-template-columns:1fr}}
</style>

<script>/* Mini C++ checker: tokenizer + parser + static resolver + interpreter for the beginner subset taught in the course. */
(function (root) {
'use strict';

const BASE_TYPES = ['int', 'float', 'double', 'char', 'bool', 'void', 'string', 'auto'];
const TYPEWORDS = new Set(BASE_TYPES.concat(['long', 'short', 'unsigned', 'signed']));
const MODS = new Set(['const', 'static', 'inline']);
const INTLIKE = new Set(['int', 'short', 'long', 'uint', 'ulong', 'char', 'bool']);
const ASSIGN = new Set(['=', '+=', '-=', '*=', '/=', '%=', '&=', '|=', '^=', '<<=', '>>=']);
const LEVELS = [['||'], ['&&'], ['|'], ['^'], ['&'], ['==', '!='], ['<', '<=', '>', '>='], ['<<', '>>'], ['+', '-'], ['*', '/', '%']];
const SIZES = { int: 4, short: 2, long: 8, uint: 4, ulong: 8, char: 1, bool: 1, float: 4, double: 8, string: 32 };
const MATH_FUNCS = new Set(['sqrt', 'pow', 'fabs', 'floor', 'ceil', 'round', 'sin', 'cos', 'tan', 'log', 'exp', 'log10', 'cbrt']);
const OTHER_FUNCS = new Set(['abs', 'max', 'min', 'swap', 'to_string', 'getline', 'setprecision', 'system']);
const STREAM_IDS = new Set(['cout', 'cin', 'endl', 'fixed']);

class CppError extends Error {
  constructor(en, ar, line, kind) {
    super(en);
    this.en = en; this.ar = ar || en; this.line = line || 0; this.kind = kind || 'compile';
  }
}
const fail = (en, ar, line, kind) => { throw new CppError(en, ar, line, kind); };

/* ---------------------------------------------------------------- lexer */
function lex(src) {
  const toks = [], includes = [], defines = {};

  const n = src.length;
  const ops2 = ['++', '--', '->', '<<', '>>', '<=', '>=', '==', '!=', '&&', '||', '+=', '-=', '*=', '/=', '%=', '&=', '|=', '^=', '::'];
  const esc = { n: '\n', t: '\t', r: '\r', '0': '\0', '\\': '\\', "'": "'", '"': '"' };
  while (i < n) {
    const c = src[i];
    if (c === '\n') { line++; i++; lineStart = true; continue; }
    if (c === ' ' || c === '\t' || c === '\r') { i++; continue; }
    if (c === '/' && src[i + 1] === '/') { while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '/' && src[i + 1] === '*') {
      const e = src.indexOf('*/', i + 2);
      const seg = e < 0 ? src.slice(i) : src.slice(i, e + 2);
      line += (seg.match(/\n/g) || []).length;

    }

      const text = src.slice(i + 1, e).trim();

      if ((m = /^include\s*[<"]([^>"]+)[>"]/.exec(text))) includes.push(m[1]);
      else if ((m = /^define\s+([A-Za-z_]\w*)\s*(.*)$/.exec(text))) defines[m[1]] = m[2].replace(/\/\/.*$/, '').trim();
      i = e; continue;
    }
    lineStart = false;
    let m;

    const two = src.substr(i, 2);
    if (ops2.includes(two)) { toks.push({ t: 'op', v: two, line }); i += 2; continue; }
    if ('+-*/%=<>!&|^~?:;,.(){}[]'.includes(c)) { toks.push({ t: 'op', v: c, line }); i++; continue; }
    fail("Unexpected character '" + c + "'.", "في حرف غير مفهوم '" + c + "'.", line, 'syntax');
  }
  // #define substitution (single level)
  const keys = Object.keys(defines);
  let out = toks;
  if (keys.length) {
    out = [];
    for (const t of toks) {
      if (t.t === 'id' && defines[t.v] !== undefined && defines[t.v] !== '') {
        const sub = lex(defines[t.v]).toks.filter(x => x.t !== 'eof');
        sub.forEach(s => out.push(Object.assign({}, s, { line: t.line, fromDefine: t.v })));
      } else out.push(t);
    }
  }
  // strip std::
  const res = [];
  for (let k = 0; k < out.length; k++) {
    const t = out[k];
    if (t.t === 'id' && t.v === 'std' && out[k + 1] && out[k + 1].v === '::' && out[k + 2]) {
      out[k + 2] = Object.assign({}, out[k + 2], { q: true });
      k += 1; continue;
    }
    res.push(t);
  }
  res.push({ t: 'eof', v: '<end of file>', line });
  return { toks: res, includes, defines };
}

/* --------------------------------------------------------------- parser */
class Parser {
  constructor(lexed) {
    this.toks = lexed.toks; this.includes = lexed.includes; this.p = 0;
    this.usingStd = false; this.allowed = new Set();
    this.all = this.includes.includes('bits/stdc++.h');
  }
  peek(o) { return this.toks[Math.min(this.p + (o || 0), this.toks.length - 1)]; }
  prevLine() { return this.p > 0 ? this.toks[this.p - 1].line : 1; }
  isOp(v, o) { const t = this.peek(o); return t.t === 'op' && t.v === v; }
  isId(v, o) { const t = this.peek(o); return t.t === 'id' && t.v === v; }
  eatOp(v) { if (this.isOp(v)) { this.p++; return true; } return false; }
  expectOp(v) {
    if (this.eatOp(v)) return;
    const t = this.peek();
    if (v === ';') fail("Expected ';' — it is missing at the end of line " + this.prevLine() + '.', "ناقص ؛ (semicolon) في آخر السطر " + this.prevLine() + '.', this.prevLine(), 'syntax');
    if (v === ')') fail("Expected ')' before '" + t.v + "' (line " + t.line + '). Check your brackets.', "ناقص قوس ')' قبل '" + t.v + "' (سطر " + t.line + '). راجع الأقواس.', t.line, 'syntax');
    if (v === '}') fail("Expected '}' — a block is not closed.", "ناقص قوس '}' — في بلوك مش مقفول.", t.line, 'syntax');
    fail("Expected '" + v + "' but found '" + t.v + "' (line " + t.line + ').', "المفروض يكون هنا '" + v + "' لكن لقيت '" + t.v + "' (سطر " + t.line + ').', t.line, 'syntax');
  }
  expectId() {
    const t = this.peek();
    if (t.t !== 'id') fail("Expected a name but found '" + t.v + "' (line " + t.line + ').', "المفروض يكون هنا اسم لكن لقيت '" + t.v + "' (سطر " + t.line + ').', t.line, 'syntax');
    this.p++; return t;
  }
  checkStd(t, what) {
    const v = t.v;
    if (!(t.q || this.usingStd || this.allowed.has(v)))
      fail("'" + v + "' was not declared in this scope. Add `using namespace std;` under the #include lines (or write std::" + v + ').',
        "'" + v + "' مش معرّف. لازم تكتب `using namespace std;` تحت الـ #include (أو تكتب std::" + v + ').', t.line, 'compile');
    if (this.all) return;
    const need = what === 'iomanip' ? 'iomanip' : (what === 'string' ? null : 'iostream');
    if (need === 'iostream' && !this.includes.includes('iostream'))
      fail("'" + v + "' needs `#include <iostream>` at the top of the program.", "'" + v + "' محتاجة `#include <iostream>` في أول البرنامج.", t.line, 'compile');
    if (need === 'iomanip' && !this.includes.includes('iomanip'))
      fail("'" + v + "' needs `#include <iomanip>`.", "'" + v + "' محتاجة `#include <iomanip>`.", t.line, 'compile');
    if (what === 'string' && !(this.includes.includes('string') || this.includes.includes('iostream')))
      fail("'string' needs `#include <string>`.", "'string' محتاجة `#include <string>`.", t.line, 'compile');
  }
  isTypeStart(t) { return t.t === 'id' && (TYPEWORDS.has(t.v) || MODS.has(t.v)); }
  unsupported(what, line) {
    fail(what + ' is not supported by this practice checker (it is outside this course chapter set).', what + ' مش مدعومة في الفاحص ده (برا نطاق المنهج).', line, 'unsupported');
  }

  parseType() {
    let cnst = false, stat = false, inl = false, unsig = false, longs = 0, shrt = false, base = null;
    const first = this.peek();
    for (;;) {
      const t = this.peek();
      if (t.t !== 'id') break;
      if (t.v === 'const') cnst = true;
      else if (t.v === 'static') stat = true;
      else if (t.v === 'inline') inl = true;
      else if (t.v === 'unsigned') unsig = true;
      else if (t.v === 'signed') { /* default */ }
      else if (t.v === 'long') longs++;
      else if (t.v === 'short') shrt = true;
      else if (BASE_TYPES.includes(t.v)) {
        if (base) break;
        base = t.v;
        if (t.v === 'string') this.checkStd(t, 'string');
      } else break;
      this.p++;
    }
    if (!base) {
      if (unsig || longs || shrt || this.toks[this.p - 1].v === 'signed') base = 'int';
      else fail("Expected a type name (like int) but found '" + first.v + "'.", "المفروض يكون نوع بيانات (زي int) لكن لقيت '" + first.v + "'.", first.line, 'syntax');
    }
    let kind;
    if (base === 'double') kind = 'double';
    else if (base === 'int') kind = shrt ? 'short' : (longs ? (unsig ? 'ulong' : 'long') : (unsig ? 'uint' : 'int'));
    else kind = base;
    return { kind, const: cnst, static: stat, inline: inl };
  }

  parseProgram() {
    const items = [];
    while (this.peek().t !== 'eof') {
      const t = this.peek();
      if (t.t === 'id' && t.v === 'using') {
        this.p++;
        if (this.isId('namespace')) { this.p++; const nm = this.expectId(); if (nm.v === 'std') this.usingStd = true; }
        else { const nm = this.expectId(); this.allowed.add(nm.v); }
        this.expectOp(';'); continue;
      }
      if (t.t === 'id' && ['struct', 'class', 'enum', 'typedef', 'namespace', 'template', 'union'].includes(t.v)) this.unsupported("'" + t.v + "'", t.line);
      if (this.isTypeStart(t)) {
        const save = this.p;
        const type = this.parseType();
        if (this.isOp('*')) this.unsupported('Pointers', this.peek().line);
        const nameTok = this.peek();
        if (nameTok.t === 'id' && this.isOp('(', 1)) {
          this.p++;
          items.push(this.parseFunction(type, nameTok, this.p - 1));
          continue;
        }
        this.p = save;
        const d = this.parseDecl(false);
        d.global = true;
        items.push(d);
        continue;
      }
      fail("Unexpected '" + t.v + "' outside of any function (line " + t.line + ').', "'" + t.v + "' مكانها غلط، برا أي function (سطر " + t.line + ').', t.line, 'syntax');
    }
    return items;
  }

  parseFunction(type, nameTok, pos) {
    this.expectOp('(');
    const params = [];
    if (this.isId('void') && this.isOp(')', 1)) this.p += 1;
    if (!this.isOp(')')) {
      for (;;) {
        const pt = this.parseType();
        let ref = false, arr = false;
        if (this.isOp('&')) { this.p++; ref = true; }
        if (this.isOp('*')) this.unsupported('Pointers', this.peek().line);
        let name = '';
        if (this.peek().t === 'id') name = this.peek().v, this.p++;
        if (this.isOp('[')) { this.p++; if (!this.isOp(']')) this.parseAssign(); this.expectOp(']'); arr = true; }
        let def = null;
        if (this.eatOp('=')) def = this.parseAssign();
        params.push({ kind: pt.kind, const: pt.const, ref, arr, name, def });
        if (this.eatOp(',')) continue;
        break;
      }
    }
    this.expectOp(')');
    const fn = { k: 'Func', name: nameTok.v, ret: type.kind, params, line: nameTok.line, pos, body: null };
    if (this.eatOp(';')) { fn.proto = true; return fn; }
    if (!this.isOp('{')) fail("Expected '{' to start the body of function '" + nameTok.v + "'.", "المفروض يبدأ جسم الدالة '" + nameTok.v + "' بـ '{'.", this.peek().line, 'syntax');
    fn.body = this.parseBlock();
    return fn;
  }

  parseBlock() {
    const open = this.peek();
    this.expectOp('{');
    const body = [];
    while (!this.isOp('}')) {
      if (this.peek().t === 'eof') fail("Expected '}' — the block opened on line " + open.line + ' is never closed.', "ناقص '}' — البلوك اللي اتفتح في سطر " + open.line + ' مش مقفول.', open.line, 'syntax');
      body.push(this.parseStmt());
    }
    this.p++;
    return { k: 'Block', body };
  }

  parseDecl(inFor) {
    const type = this.parseType();
    const items = [];
    for (;;) {
      let ref = false;
      if (this.isOp('&')) { this.p++; ref = true; }
      if (this.isOp('*')) this.unsupported('Pointers', this.peek().line);
      const nt = this.expectId();
      let arr = null, init = null;
      if (this.isOp('[')) {
        this.p++;
        arr = this.isOp(']') ? 'auto' : this.parseAssign();
        this.expectOp(']');
        if (this.isOp('[')) this.unsupported('Two-dimensional arrays', nt.line);
      }
      if (this.eatOp('=')) {
        if (this.isOp('{')) init = this.parseInitList();
        else init = this.parseAssign();
      } else if (this.isOp('{')) { init = this.parseInitList(); if (!arr) init = { k: 'InitOne', list: init }; }
      else if (this.isOp('(') && !arr) {
        this.p++; const a = this.parseAssign(); this.expectOp(')'); init = a;
      }
      if (type.kind === 'void') fail("A variable cannot have type 'void' (line " + nt.line + ').', "المتغير ما ينفعش يكون نوعه 'void' (سطر " + nt.line + ').', nt.line, 'compile');
      if (type.kind === 'auto' && !init) fail("'auto' needs an initial value so the type can be deduced.", "'auto' لازم يتحط له قيمة ابتدائية.", nt.line, 'compile');
      items.push({ name: nt.v, arr, init, ref, line: nt.line });
      if (this.eatOp(',')) continue;
      break;
    }
    const node = { k: 'Decl', type, items, line: this.peek().line };
    if (!inFor) this.expectOp(';');
    return node;
  }
  parseInitList() {
    this.expectOp('{');
    const list = [];
    if (!this.isOp('}')) { do { if (this.isOp('}')) break; list.push(this.parseAssign()); } while (this.eatOp(',')); }
    this.expectOp('}');
    return { k: 'InitList', list };
  }

  parseStmt() {
    const t = this.peek();
    if (t.t === 'op') {
      if (t.v === '{') return this.parseBlock();
      if (t.v === ';') { this.p++; return { k: 'Empty' }; }
    }
    if (t.t === 'id') {
      switch (t.v) {
        case 'if': {
          this.p++; this.expectOp('('); const c = this.parseExpr(); this.expectOp(')');
          const a = this.parseStmt(); let b = null;
          if (this.isId('else')) { this.p++; b = this.parseStmt(); }
          return { k: 'If', c, a, b, line: t.line };
        }
        case 'else': fail("'else' without a matching 'if' (line " + t.line + ').', "'else' من غير 'if' مناسب قبلها (سطر " + t.line + ').', t.line, 'syntax'); break;
        case 'while': {
          this.p++; this.expectOp('('); const c = this.parseExpr(); this.expectOp(')');
          return { k: 'While', c, body: this.parseStmt(), line: t.line };
        }
        case 'do': {
          this.p++; const body = this.parseStmt();
          if (!this.isId('while')) fail("Expected 'while' after the body of do { ... } (line " + this.peek().line + ').', "المفروض يجي 'while' بعد جسم do { ... } (سطر " + this.peek().line + ').', this.peek().line, 'syntax');
          this.p++; this.expectOp('('); const c = this.parseExpr(); this.expectOp(')'); this.expectOp(';');
          return { k: 'DoWhile', c, body, line: t.line };
        }
        case 'for': {
          this.p++; this.expectOp('(');
          let init = null, c = null, upd = null;
          if (!this.isOp(';')) {
            if (this.isTypeStart(this.peek())) init = this.parseDecl(true);
            else init = { k: 'ExprS', e: this.parseExpr(), line: t.line };
          }
          this.expectOp(';');
          if (!this.isOp(';')) c = this.parseExpr();
          this.expectOp(';');
          if (!this.isOp(')')) upd = this.parseExpr();
          this.expectOp(')');
          return { k: 'For', init, c, upd, body: this.parseStmt(), line: t.line };
        }
        case 'switch': {
          this.p++; this.expectOp('('); const e = this.parseExpr(); this.expectOp(')'); this.expectOp('{');
          const cases = [];
          while (!this.isOp('}')) {
            let test = null;
            if (this.isId('case')) { this.p++; test = this.parseCond(); }
            else if (this.isId('default')) { this.p++; }
            else fail("Inside a switch, every statement must come after a 'case' or 'default' label (line " + this.peek().line + ').', "جوه الـ switch لازم كل حاجة تيجي بعد 'case' أو 'default' (سطر " + this.peek().line + ').', this.peek().line, 'syntax');
            this.expectOp(':');
            const body = [];
            while (!this.isId('case') && !this.isId('default') && !this.isOp('}')) {
              if (this.peek().t === 'eof') fail("Expected '}' to close the switch.", "ناقص '}' لقفل الـ switch.", this.peek().line, 'syntax');
              body.push(this.parseStmt());
            }
            cases.push({ test, body });
          }
          this.p++;
          return { k: 'Switch', e, cases, line: t.line };
        }
        case 'return': {
          this.p++; let e = null;
          if (!this.isOp(';')) e = this.parseExpr();
          this.expectOp(';');
          return { k: 'Return', e, line: t.line };
        }
        case 'break': this.p++; this.expectOp(';'); return { k: 'Break', line: t.line };
        case 'continue': this.p++; this.expectOp(';'); return { k: 'Continue', line: t.line };
        case 'goto': this.unsupported("'goto'", t.line); break;
        default:
      }
      if (this.isTypeStart(t) && !(TYPEWORDS.has(t.v) && this.isOp('(', 1) && !MODS.has(t.v))) return this.parseDecl(false);
    }
    const e = this.parseExpr();
    this.expectOp(';');
    return { k: 'ExprS', e, line: t.line };
  }

  parseExpr() {
    const e = this.parseAssign();
    if (this.isOp(',')) {
      const list = [e];
      while (this.eatOp(',')) list.push(this.parseAssign());
      return { k: 'Comma', list };
    }
    return e;
  }
  parseAssign() {
    const l = this.parseCond();
    const t = this.peek();
    if (t.t === 'op' && ASSIGN.has(t.v)) {
      this.p++;
      if (!(l.k === 'Id' || l.k === 'Index')) fail('The left side of an assignment must be a variable (line ' + t.line + ').', 'الناحية الشمال من علامة = لازم تكون متغير (سطر ' + t.line + ').', t.line, 'compile');
      const r = this.parseAssign();
      return { k: 'Assign', op: t.v, l, r, line: t.line };
    }
    return l;
  }
  parseCond() {
    const c = this.parseBin(0);
    if (this.isOp('?')) {
      this.p++; const a = this.parseExpr(); this.expectOp(':'); const b = this.parseAssign();
      return { k: 'Cond', c, a, b };
    }
    return c;
  }
  parseBin(lv) {
    if (lv >= LEVELS.length) return this.parseUnary();
    let l = this.parseBin(lv + 1);
    for (;;) {
      const t = this.peek();
      if (t.t === 'op' && LEVELS[lv].includes(t.v)) {
        this.p++;
        const r = this.parseBin(lv + 1);
        l = { k: 'Bin', op: t.v, l, r, line: t.line };
      } else break;
    }
    return l;
  }
  isCastAhead() {
    const t = this.peek(1);
    return t.t === 'id' && TYPEWORDS.has(t.v) && t.v !== 'auto' && t.v !== 'void' || (t.t === 'id' && t.v === 'const');
  }
  parseUnary() {
    const t = this.peek();
    if (t.t === 'op') {
      if (t.v === '!' || t.v === '-' || t.v === '+' || t.v === '~') { this.p++; return { k: 'Unary', op: t.v, e: this.parseUnary(), line: t.line }; }
      if (t.v === '++' || t.v === '--') { this.p++; return { k: 'Pre', op: t.v, e: this.parseUnary(), line: t.line }; }
      if (t.v === '(' && this.isCastAhead()) {
        this.p++; const type = this.parseType(); this.expectOp(')');
        return { k: 'Cast', type: type.kind, e: this.parseUnary(), line: t.line };
      }
      if (t.v === '&' || t.v === '*') this.unsupported('Pointers / address-of', t.line);
    }
    if (t.t === 'id' && t.v === 'sizeof') {
      this.p++;
      if (this.isOp('(') && this.isTypeStart(this.peek(1))) {
        this.p++; const type = this.parseType(); this.expectOp(')');
        return { k: 'Sizeof', type: type.kind, line: t.line };
      }
      return { k: 'Sizeof', e: this.parseUnary(), line: t.line };
    }
    return this.parsePostfix();
  }
  parsePostfix() {
    let e = this.parsePrimary();
    for (;;) {
      const t = this.peek();
      if (t.t !== 'op') break;
      if (t.v === '[') { this.p++; const idx = this.parseExpr(); this.expectOp(']'); e = { k: 'Index', obj: e, idx, line: t.line }; }
      else if (t.v === '.') {
        this.p++; const nm = this.expectId(); let args = [];
        if (this.isOp('(')) { this.p++; if (!this.isOp(')')) { do args.push(this.parseAssign()); while (this.eatOp(',')); } this.expectOp(')'); }
        e = { k: 'Method', obj: e, name: nm.v, args, line: nm.line };
      }
      else if (t.v === '++' || t.v === '--') { this.p++; e = { k: 'Post', op: t.v, e, line: t.line }; }
      else break;
    }
    return e;
  }
  parsePrimary() {
    const t = this.peek();
    if (t.t === 'num') { this.p++; return { k: 'Lit', t: t.f ? (t.single ? 'float' : 'double') : (t.long ? 'long' : 'int'), v: t.v }; }
    if (t.t === 'str') { this.p++; return { k: 'Lit', t: 'string', v: t.v }; }
    if (t.t === 'chr') { this.p++; return { k: 'Lit', t: 'char', v: t.v }; }
    if (t.t === 'op' && t.v === '(') {
      this.p++; const e = this.parseExpr(); this.expectOp(')');
      return e.k === 'Id' || e.k === 'Index' ? { k: 'Paren', e } : e;
    }
    if (t.t === 'id') {
      if (t.v === 'true' || t.v === 'false') { this.p++; return { k: 'Lit', t: 'bool', v: t.v === 'true' ? 1 : 0 }; }
      if (t.v === 'static_cast') {
        this.p++; this.expectOp('<'); const type = this.parseType(); this.expectOp('>'); this.expectOp('(');
        const e = this.parseExpr(); this.expectOp(')');
        return { k: 'Cast', type: type.kind, e, line: t.line };
      }
      if (TYPEWORDS.has(t.v) && this.isOp('(', 1) && t.v !== 'void') {
        const type = this.parseType(); this.expectOp('(');
        const e = this.parseExpr(); this.expectOp(')');
        return { k: 'Cast', type: type.kind, e, line: t.line };
      }
      this.p++;
      if (this.isOp('(')) {
        const pos = this.p - 1;
        this.p++;
        const args = [];
        if (!this.isOp(')')) { do args.push(this.parseAssign()); while (this.eatOp(',')); }
        this.expectOp(')');
        if (t.v === 'setprecision') this.checkStd(t, 'iomanip');
        return { k: 'Call', name: t.v, args, line: t.line, pos, q: t.q };
      }
      if (STREAM_IDS.has(t.v)) this.checkStd(t);
      return { k: 'Id', name: t.v, line: t.line, pos: this.p - 1 };
    }
    if (t.t === 'eof') fail('The program ended unexpectedly — something is missing (e.g. a } or ;).', 'البرنامج خلص فجأة — في حاجة ناقصة (زي } أو ؛).', t.line, 'syntax');
    fail("Unexpected '" + t.v + "' on line " + t.line + '.', "'" + t.v + "' جت في مكان غلط في سطر " + t.line + '.', t.line, 'syntax');
  }
}

/* ------------------------------------------------------------- resolver */
function editDistance(a, b) {
  const d = [];
  for (let i = 0; i <= a.length; i++) { d[i] = [i]; }
  for (let j = 0; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

function resolve(items, parser) {
  const firstDecl = new Map();
  items.forEach(it => { if (it.k === 'Func') { if (!firstDecl.has(it.name) || firstDecl.get(it.name) > it.pos) firstDecl.set(it.name, it.pos); } });
  const scopes = [new Map()];
  const incs = parser.includes, all = parser.all;
  const lookup = name => { for (let i = scopes.length - 1; i >= 0; i--) if (scopes[i].has(name)) return scopes[i].get(name); return null; };
  const declare = (name, info, line) => {
    const top = scopes[scopes.length - 1];
    if (top.has(name)) fail("Redeclaration of '" + name + "' (line " + line + '): a variable with this name already exists in the same block.', "المتغير '" + name + "' اتعرّف قبل كده في نفس البلوك (سطر " + line + ').', line, 'compile');
    top.set(name, info);
  };
  const suggest = name => {

    function callUser(n) {

      const scope = new Map();

          } else scope.set(p.name, newCell(p.kind, coerce(p.kind, argVals[i], n.line).v));
        } else {

      });
      const saved = frame;

      if (!rv) {

        fail("Function '" + f.name + "' finished without returning a value (line " + f.line + '). Add a `return` statement.', "الدالة '" + f.name + "' خلصت من غير ما ترجّع قيمة (سطر " + f.line + '). ضيف `return`.', f.line, 'runtime');

    function evalE(n) {

        case 'Id': {

          if (c) return readCell(c, n.name, n.line);
          if (n.name === 'cout') return { t: 'ostream' };
          if (n.name === 'cin') return { t: 'istream' };
          if (n.name === 'endl') return { t: 'manip', v: 'endl' };
          if (n.name === 'fixed') return { t: 'manip', v: 'fixed' };
          fail("'" + n.name + "' was not declared (line " + n.line + ').', "'" + n.name + "' مش معرّف (سطر " + n.line + ').', n.line, 'compile');

            else if (b.t === 'void') fail("You cannot print the result of a void function (line " + n.line + ').', "ما ينفعش تطبع ناتج دالة void (سطر " + n.line + ').', n.line, 'compile');
            else emit(fmtVal(b));

          }
          if (n.op === '>>' && a.t === 'istream') {
            const c = lvalue(n.r);
            readInput(c, n.line, n.r.name);
            return a;
          }
          if (a.t === 'ostream' || a.t === 'istream') fail("Wrong stream operator: use << with cout and >> with cin (line " + n.line + ').', "عامل الـ stream غلط: استخدم << مع cout و >> مع cin (سطر " + n.line + ').', n.line, 'compile');
          const b = evalE(n.r);
          return binArith(n.op, a, b, n.line);
        }
        case 'Cond': return evalE(n.c).v ? evalE(n.a) : evalE(n.b);
        case 'Comma': { let r; n.list.forEach(e => { r = evalE(e); }); return r; }
        case 'Cast': return coerceCast(n.type, evalE(n.e), n.line);
        case 'Sizeof': {

        case 'Call': {

        default: fail('Unsupported expression (' + n.k + ').', 'تعبير مش مدعوم.', n.line, 'unsupported');
      }
      return null;
    }
    function coerceCast(kind, v, line) {
      if (kind === 'string') return coerce('string', v, line);
      if (v.t === 'string') fail('Cannot cast a string to ' + kind + ' (line ' + line + ').', 'ما ينفعش تحوّل نص لـ ' + kind + ' (سطر ' + line + ').', line, 'compile');
      return coerce(kind, v, line);
    }
    function evalMethod(n) {

    }

    /* ---- statements */
    function declare(decl, scopeMap, isGlobal) {
      decl.items.forEach(it => {
        tick(it.line);
        let kind = decl.type.kind;
        if (decl.type.static && statics.has(it)) { scopeMap.set(it.name, statics.get(it)); return; }

        if (it.ref) {

        } else if (it.arr) {

          for (let i = 0; i < size; i++) arr.push(newCell(kind, list ? (i < list.length ? coerce(kind, list[i], it.line).v : defaultOf(kind)) : (isGlobal || decl.type.static ? defaultOf(kind) : undefined)));

            else val = evalE(it.init);
            if (kind === 'auto') kind = val.t === 'void' ? 'int' : val.t;

    }
    function execList(list) {
      for (const s of list) { const r = exec(s); if (r) return r; }

    }
    function inScope(fn) {
      frame.scopes.push(new Map());
      try { return fn(); } finally { frame.scopes.pop(); }
    }
    function exec(s) {
      switch (s.k) {
        case 'Empty': return null;
        case 'Block': tick(0); return inScope(() => execList(s.body));
        case 'Decl': declare(s, frame.scopes[frame.scopes.length - 1], false); return null;
        case 'ExprS': tick(s.line); evalE(s.e); return null;
        case 'If': tick(s.line); if (evalE(s.c).v) return exec(s.a); else if (s.b) return exec(s.b); return null;
        case 'While': {
          while (evalE(s.c).v) { tick(s.line); const r = exec(s.body); if (r === BREAK) break; if (r instanceof Return) return r; }
          return null;
        }
        case 'DoWhile': {
          do { tick(s.line); const r = exec(s.body); if (r === BREAK) break; if (r instanceof Return) return r; } while (evalE(s.c).v);

        }

          if (start < 0) start = def;
          if (start < 0) return null;
          return inScope(() => {
            for (let i = start; i < s.cases.length; i++) {
              const r = execList(s.cases[i].body);
              if (r === BREAK) return null;
              if (r) return r;
            }
            return null;
          });
        }
        case 'Return': return new Return(s.e ? evalE(s.e) : { t: 'void', v: 0 });
        case 'Break': return BREAK;
        case 'Continue': return CONTINUE;
        default: fail('Unsupported statement.', 'جملة مش مدعومة.', s.line, 'unsupported');
      }
      return null;
    }

    // globals
    frame = { scopes: [] };
    items.forEach(it => { if (it.k === 'Decl') declare(it, globals, true); });
    const mainFn = mains[0];
    const exit = callUser({ name: 'main', args: [], line: mainFn.line });
    return result(true, { exit: exit.v });
  } catch (e) {
    if (e instanceof RangeError) return result(false, { error: { kind: 'runtime', en: 'Too many nested function calls: a function probably calls itself forever — add a base case to stop the recursion.', ar: 'نداءات دوال متداخلة كتير جدًا: غالبًا دالة بتنادي نفسها للأبد — ضيف شرط توقف (base case).', line: 0 } });

}

function analyze(src) {
  try {
    const parser = new Parser(lex(src));
    const items = parser.parseProgram();
    const info = { funcs: {}, recursive: [], userFuncs: [] };
    const collect = (n, set) => {
      if (!n || typeof n !== 'object') return;
      if (Array.isArray(n)) { n.forEach(x => collect(x, set)); return; }
      if (n.k === 'Call') set.add(n.name);
      for (const key in n) { if (key !== 'k') collect(n[key], set); }
    };
    items.forEach(it => {
      if (it.k === 'Func' && it.body) {

        info.funcs[it.name] = set;
        if (it.name !== 'main') info.userFuncs.push(it.name);
        if (set.has(it.name)) info.recursive.push(it.name);
      }
    });

  } catch (e) { return null; }
}

/* ---------------- checker ---------------- */
const stripComments = c => c.replace(/\/\*[\s\S]*?\*\/|\/\/[^\n]*/g, '');
const norm = s => String(s).replace(/\s+/g, ' ').trim();

function checkTask(task, code) {
  if (!code || !code.trim()) return { status: 'empty' };
  const clean = stripComments(code);
  const tests = [];
  for (const t of task.tests) {
    const r = root.CPP.run(code, t.input);
    if (!r.ok) return { status: 'error', error: r.error, output: r.output, input: t.input };
    tests.push({ input: t.input, expected: t.out, got: r.output, ok: norm(r.output) === norm(t.out) });
  }
  const info = root.CPP.analyze(code);
  const reqs = task.must.map(m => {
    let ok = true;
    if (m.re) ok = m.re.test(clean);
    else if (m.fn === 'recursive') ok = !!(info && info.recursive.length);
    else if (m.fn && m.fn.startsWith('userFunc:')) ok = !!(info && info.userFuncs.includes(m.fn.slice(9)));
    return { ok, en: m.en, ar: m.ar };
  });
  const testsOk = tests.every(t => t.ok), reqOk = reqs.every(r => r.ok);
  return {
    status: testsOk && reqOk ? 'correct' : (!testsOk ? 'wrong-output' : 'missing'),
    tests, reqs, firstFail: tests.find(t => !t.ok) || null
  };
}
