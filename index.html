  sections: [
    S(['More than using a computer', 'أكتر من مجرد استخدام الكمبيوتر'], [
      ['Computer science is the systematic study of computation, information, algorithms and computational systems. It is broader than learning to operate a computer or write software: it studies the principles that let machines and programs solve problems.', 'علم الحاسب هو الدراسة المنظمة للـ computation والمعلومات والـ algorithms والأنظمة الحاسوبية. وهو أوسع من تعلم تشغيل الكمبيوتر أو كتابة البرامج: بيدرس المبادئ اللي بتخلّي الأجهزة والبرامج تحل المشاكل.'],
      ['It is a mistake to see it only as hardware engineering. Programming languages, algorithms, artificial intelligence, databases, cybersecurity and computer graphics can all be studied without designing a physical machine.', 'غلط نشوفه كهندسة هاردوير بس. لغات البرمجة والـ algorithms والذكاء الاصطناعي وقواعد البيانات والأمن السيبراني والجرافيكس كلها ممكن تتدرس من غير ما نصمم جهاز.']]),
    S(['Computation: input, process, output', 'الـ Computation: مدخلات ومعالجة ومخرجات'], [
      ['Computation is the process of transforming input into output according to a set of rules. A calculator receives two numbers, adds them and shows the sum.', 'الـ Computation هي تحويل المدخلات لمخرجات حسب مجموعة قواعد. الآلة الحاسبة بتاخد رقمين وتجمعهم وتعرض الناتج.'],
      ['Almost every program fits this pattern: a weather app takes a location, processes weather data and produces a forecast; a search engine takes a query, ranks information and shows results; a bank app verifies a transaction and updates records.', 'تقريبًا أي برنامج بيمشي على النمط ده: تطبيق الطقس بياخد المكان ويعالج بيانات الطقس ويطلّع توقع؛ محرك البحث ياخد استعلام ويرتب المعلومات ويعرض النتايج؛ تطبيق البنك بيتحقق من العملية ويحدّث السجلات.']]),
    S(['Algorithms and efficiency', 'الـ Algorithms والكفاءة'], [
      ['An algorithm is a precise procedure for solving a problem. Recipes and math procedures are algorithms too. To find a name in a list you could check every name one by one — valid, but slow for huge lists.', 'الـ algorithm هو إجراء دقيق لحل مشكلة. الوصفات والعمليات الحسابية كلها algorithms. عشان تلاقي اسم في قايمة ممكن تفحص كل الأسماء واحد واحد — ده صح بس بطيء مع القوائم الضخمة.'],
      ['If the names are sorted you can check the middle one, throw away half of the possibilities and repeat. This is binary search. Computer science asks not only whether a problem can be solved, but how efficiently — that is time complexity and space complexity.', 'لو الأسماء مرتبة تقدر تفحص اللي في النص وتشيل نص الاحتمالات وتكرر. ده الـ binary search. علم الحاسب مابيسألش بس هل المشكلة تتحل، لكن كمان بأي كفاءة — وده الـ time complexity والـ space complexity.']]),
    S(['Computational thinking', 'التفكير الحاسوبي'], [
      ['Computational thinking has four related skills. Decomposition: break a complicated problem into smaller ones (an online shop = accounts, catalog, cart, payment, shipping). Pattern recognition: notice similarities between problems. Abstraction: focus on what matters and ignore unnecessary details. Algorithm design: write the steps that solve it.', 'التفكير الحاسوبي فيه 4 مهارات مترابطة. Decomposition: تقسيم المشكلة المعقدة لمشاكل أصغر (متجر أونلاين = حسابات وكتالوج وسلة ودفع وشحن). Pattern recognition: ملاحظة التشابه بين المشاكل. Abstraction: التركيز على المهم وتجاهل التفاصيل غير الضرورية. Algorithm design: كتابة الخطوات اللي بتحل المشكلة.'],
      ['These skills are useful outside computing: an event planner decomposes the event into venue, guests, food and transport.', 'المهارات دي مفيدة برا الكمبيوتر كمان: منظم الحفلات بيقسّم الحفلة لمكان وضيوف وأكل ومواصلات.']]),
  ] },
/* 2 */ { n: 2, group: 'A', title: ['The History and Evolution of Computers', 'تاريخ وتطور الكمبيوتر'], blurb: ['From mechanical gears to smartphones, cloud and AI.', 'من التروس الميكانيكية للموبايل والـ cloud والـ AI.'], lab: 'timeline',
  sections: [
    S(['Before electronics', 'قبل الإلكترونيات'], [
      ['Charles Babbage designed the Analytical Engine, a mechanical machine that could in principle be programmed to perform many kinds of calculations. It already had the key ideas of input, a processing unit, memory and output.', 'صمم تشارلز بابّاج الـ Analytical Engine، وهي آلة ميكانيكية تقدر نظريًا تتبرمج لعمليات حسابية كتير. كان فيها أفكار أساسية: مدخلات ووحدة معالجة وذاكرة ومخرجات.'],
      ['Electromechanical and early electronic computers followed. They were huge, used relays or vacuum tubes and filled whole rooms.', 'بعدها جت كمبيوترات كهروميكانيكية وإلكترونية مبكرة. كانت ضخمة وبتستخدم relays أو صمامات مفرغة وبتملأ أوض كاملة.']]),
    S(['The stored-program concept', 'مفهوم البرنامج المخزّن'], [
      ['The stored-program idea says that instructions are kept in memory just like data. This lets a computer change its task by loading a different program instead of being rewired.', 'فكرة البرنامج المخزّن بتقول إن الأوامر بتتخزّن في الذاكرة زيها زي البيانات. وده بيخلّي الكمبيوتر يغيّر مهمته بتحميل برنامج تاني بدل ما نعيد توصيل الأسلاك.']]),
    S(['Smaller and faster', 'أصغر وأسرع'], [
      ['Transistors replaced vacuum tubes: smaller, cheaper, cooler and more reliable. Integrated circuits then packed many transistors on one chip, and the microprocessor put a whole CPU on a single chip, which made the personal computer possible.', 'الترانزستور حل محل الصمامات المفرغة: أصغر وأرخص وأبرد وأكثر اعتمادية. بعدين الدوائر المتكاملة حطت ترانزستورات كتير على شريحة واحدة، والـ microprocessor حط CPU كامل على شريحة واحدة، وده خلّى الكمبيوتر الشخصي ممكن.']]),
    S(['The connected era', 'عصر الاتصال'], [
      ['The internet connected computers worldwide, mobile computing put them in our pockets with sensors and location services, cloud computing moved storage and processing to remote data centers, and artificial intelligence now learns patterns from huge amounts of data.', 'الإنترنت وصّل الكمبيوترات حول العالم، والحوسبة المحمولة حطتها في جيوبنا بحساسات وخدمات مواقع، والحوسبة السحابية نقلت التخزين والمعالجة لمراكز بيانات بعيدة، والذكاء الاصطناعي دلوقتي بيتعلم أنماط من كميات بيانات ضخمة.']]),
  ] },
/* 3 */ { n: 3, group: 'A', title: ['Computer Hardware and Architecture', 'مكونات الكمبيوتر ومعماريته'], blurb: ['CPU, memory, storage and how they cooperate.', 'الـ CPU والذاكرة والتخزين وإزاي بيشتغلوا مع بعض.'], lab: 'cpu',
  sections: [
    S(['The CPU and its clock', 'الـ CPU والـ clock'], [
      ['The Central Processing Unit executes instructions. It repeats a cycle: fetch an instruction from memory, decode it, execute it. Clock speed (in GHz) says how many cycles happen per second, but performance also depends on the design and the number of cores.', 'وحدة المعالجة المركزية بتنفذ الأوامر. بتكرر دورة: تجيب أمر من الذاكرة (fetch) وتفسّره (decode) وتنفذه (execute). سرعة الـ clock (بالـ GHz) بتقول كام دورة بتحصل في الثانية، لكن الأداء كمان بيعتمد على التصميم وعدد الـ cores.']]),
    S(['Memory and storage', 'الذاكرة والتخزين'], [
      ['RAM is fast working memory that holds the programs and data in use right now; it is volatile, so it loses its contents without power. Storage (HDD or SSD) keeps data permanently but is slower.', 'الـ RAM ذاكرة عمل سريعة بتحمل البرامج والبيانات المستخدمة حاليًا؛ وهي volatile يعني بتفقد محتواها من غير كهربا. أما الـ Storage (HDD أو SSD) فبيحفظ البيانات بشكل دائم لكنه أبطأ.'],
      ['The memory hierarchy arranges memory from registers and cache (tiny, fastest) to RAM to storage (large, slowest). Faster memory is smaller and more expensive.', 'هرم الذاكرة بيرتب الذاكرة من registers و cache (صغيرة وأسرع حاجة) لـ RAM لـ storage (كبير وأبطأ). الذاكرة الأسرع أصغر وأغلى.']]),
    S(['Connecting everything', 'ربط كل حاجة ببعض'], [
      ['The motherboard connects the components, and buses carry data between them. Input and output devices connect people and machines, and the GPU handles graphics and highly parallel work.', 'اللوحة الأم بتوصّل المكونات، والـ buses بتنقل البيانات بينهم. أجهزة الإدخال والإخراج بتوصّل الإنسان بالآلة، والـ GPU بيتعامل مع الجرافيكس والشغل المتوازي.']]),
    S(['Binary and embedded systems', 'النظام الثنائي والأنظمة المدمجة'], [
      ['All hardware works with binary signals: on and off, 1 and 0. Embedded systems are small computers built inside other devices such as cars, washing machines and medical tools.', 'كل الهاردوير بيشتغل بإشارات ثنائية: شغال وطافي، 1 و 0. الـ Embedded systems كمبيوترات صغيرة مبنية جوه أجهزة تانية زي العربيات والغسالات والأجهزة الطبية.']]),
  ] },
/* 4 */ { n: 4, group: 'A', title: ['Data, Information, and Digital Representation', 'البيانات والمعلومات والتمثيل الرقمي'], blurb: ['Bits, bytes, binary, hexadecimal and how text, images and sound become numbers.', 'الـ bits والـ bytes والـ binary والـ hex وإزاي النصوص والصور والصوت بتبقى أرقام.'], lab: 'bits',
  sections: [
    S(['Bits and bytes', 'الـ Bits والـ Bytes'], [
      ['A bit is a single 0 or 1. Eight bits make a byte. Everything a computer stores — numbers, text, pictures, sound — is stored as patterns of bits.', 'الـ bit هو 0 أو 1 واحد. تمانية bits بيكوّنوا byte. أي حاجة الكمبيوتر بيخزّنها — أرقام ونصوص وصور وصوت — بتتخزن كأنماط من الـ bits.']]),
    S(['Binary and hexadecimal', 'الـ Binary والـ Hexadecimal'], [
      ['Binary is base 2: each position is worth a power of two (… 8, 4, 2, 1). So 1010 = 8 + 2 = 10. Hexadecimal is base 16 (0-9 and A-F); one hex digit equals exactly four bits, so it is a short way to write binary.', 'الـ Binary نظام أساسه 2: كل خانة قيمتها قوة من 2 (… 8 و 4 و 2 و 1). يعني 1010 = 8 + 2 = 10. والـ Hexadecimal أساسه 16 (من 0-9 و A-F)؛ والرقم الـ hex الواحد بيساوي 4 bits بالظبط، فهو طريقة مختصرة لكتابة الـ binary.']]),
    S(['Text, images and sound', 'النص والصور والصوت'], [
      ['Text is stored by giving each character a number (ASCII, Unicode): for example the letter A is 65. Images are grids of pixels, and in RGB each pixel mixes red, green and blue values. Audio is stored as many samples of the sound wave per second; video is a sequence of images plus audio. Compression makes files smaller.', 'النص بيتخزّن بإعطاء كل حرف رقم (ASCII و Unicode): مثلًا الحرف A هو 65. الصور شبكات من الـ pixels، وفي RGB كل pixel بيخلط قيم أحمر وأخضر وأزرق. الصوت بيتخزن كعينات كتير من الموجة الصوتية في الثانية؛ والفيديو سلسلة صور مع صوت. والـ Compression بيصغّر حجم الملفات.']]),
    S(['Data, information and quality', 'البيانات والمعلومات والجودة'], [
      ['Data is raw facts; information is data with meaning and context; metadata is data about data (like a photo\'s date). Data quality matters: poor input gives poor results — "garbage in, garbage out".', 'البيانات هي حقائق خام؛ والمعلومات هي بيانات ليها معنى وسياق؛ والـ metadata بيانات عن البيانات (زي تاريخ الصورة). جودة البيانات مهمة: مدخلات سيئة بتدّي نتايج سيئة — "garbage in, garbage out".']]),
  ] },
/* 5 */ { n: 5, group: 'A', title: ['Operating Systems and System Software', 'أنظمة التشغيل وبرمجيات النظام'], blurb: ['Kernel, processes, multitasking, memory and files.', 'الـ kernel والـ processes والـ multitasking والذاكرة والملفات.'], lab: 'scheduler',
  sections: [
    S(['What an operating system does', 'نظام التشغيل بيعمل إيه'], [
      ['An operating system manages hardware and gives programs a safe, organized way to use it. Its core is the kernel. Programs ask the kernel for services through system calls.', 'نظام التشغيل بيدير الهاردوير وبيدّي البرامج طريقة آمنة ومنظمة لاستخدامه. قلبه هو الـ kernel. والبرامج بتطلب خدمات من الـ kernel عن طريق الـ system calls.']]),
    S(['Processes and multitasking', 'الـ Processes والـ Multitasking'], [
      ['A process is a running program. With multitasking the CPU switches between processes so quickly (each gets a small time slice) that many programs seem to run at once.', 'الـ process هو برنامج شغال. ومع الـ multitasking الـ CPU بيبدّل بين العمليات بسرعة كبيرة (كل واحدة بتاخد time slice صغيرة) فبرامج كتير تبان شغالة في نفس الوقت.']]),
    S(['Memory, files and devices', 'الذاكرة والملفات والأجهزة'], [
      ['Memory management gives each process its own space and protects it from others. The file system organizes data on storage into files and folders. Device management uses drivers to talk to hardware.', 'إدارة الذاكرة بتدّي كل process مساحتها الخاصة وبتحميها من غيرها. الـ file system بينظم البيانات على التخزين في ملفات ومجلدات. وإدارة الأجهزة بتستخدم drivers للتعامل مع الهاردوير.']]),
    S(['Interfaces, security and virtualization', 'الواجهات والأمان والـ Virtualization'], [
      ['User interfaces can be command-line or graphical. The OS enforces security by controlling accounts and permissions and stopping unauthorized programs. Virtualization lets one physical machine run several virtual machines.', 'واجهات المستخدم ممكن تكون command-line أو رسومية. ونظام التشغيل بيفرض الأمان بالتحكم في الحسابات والصلاحيات ومنع البرامج غير المصرح بيها. والـ Virtualization بيخلّي جهاز واحد يشغّل كذا virtual machine.']]),
  ] },
/* 6 */ { n: 6, group: 'A', title: ['Programming Fundamentals', 'أساسيات البرمجة'], blurb: ['Variables, conditions, loops, functions and debugging.', 'المتغيرات والشروط واللوبات والدوال والـ debugging.'], lab: 'trace6',
  sections: [
    S(['The building blocks', 'اللبنات الأساسية'], [
      ['A variable is a named location that stores a value. A data type says what kind of value it holds (whole number, decimal, text...). Operators combine values: arithmetic, comparison and logical operators.', 'المتغير مكان له اسم بيخزّن قيمة. ونوع البيانات بيقول القيمة من أي نوع (عدد صحيح، عشري، نص...). والـ operators بتجمع القيم: عمليات حسابية ومقارنة ومنطقية.'],
      ['Every program is built from three structures: sequence (one step after another), selection (choose a path with conditions) and iteration (repeat with loops).', 'أي برنامج بيتبني من 3 هياكل: sequence (خطوة ورا خطوة) و selection (اختيار مسار بالشروط) و iteration (تكرار باللوبات).']]),
    S(['Functions', 'الدوال'], [
      ['A function groups instructions under a name so you can reuse them. It can take parameters (inputs) and return a value (output).', 'الدالة بتجمّع أوامر تحت اسم عشان تقدر تعيد استخدامها. وممكن تاخد parameters (مدخلات) وترجّع قيمة (مخرجات).']]),
    S(['Errors, debugging and testing', 'الأخطاء والـ debugging والـ testing'], [
      ['Syntax errors break the language rules and are caught by the compiler. Runtime errors happen while the program runs (for example dividing by zero). Logic errors let the program run but give wrong results. Debugging means finding and fixing them; testing means checking the program with many inputs.', 'أخطاء الـ Syntax بتكسر قواعد اللغة والـ compiler بيمسكها. أخطاء الـ Runtime بتحصل وقت التشغيل (زي القسمة على صفر). أخطاء الـ Logic بتخلّي البرنامج يشتغل لكن بنتيجة غلط. الـ Debugging هو إيجادها وإصلاحها؛ والـ testing هو تجربة البرنامج بمدخلات كتيرة.']]),
    S(['Languages and good habits', 'اللغات والعادات الكويسة'], [
      ['Object-oriented programming organizes code into objects, and there are many programming languages for many purposes. Version control tracks changes to code. Good programmers write code as communication: clear names, comments and simple structure.', 'البرمجة كائنية التوجه بتنظم الكود في objects، وفي لغات برمجة كتير لأغراض كتير. والـ Version control بيتتبع تغييرات الكود. المبرمج الشاطر بيكتب الكود كوسيلة تواصل: أسماء واضحة وتعليقات وهيكل بسيط.']]),
  ] },
/* 7 */ { n: 7, group: 'A', title: ['Data Structures and Databases', 'هياكل البيانات وقواعد البيانات'], blurb: ['Arrays, stacks, queues, trees, hash tables and relational databases.', 'الـ arrays والـ stacks والـ queues والـ trees والـ hash tables وقواعد البيانات العلائقية.'], lab: 'stackqueue',
  sections: [
    S(['Choosing how to organize data', 'اختيار طريقة تنظيم البيانات'], [
      ['The choice of data structure strongly affects how efficient a program is. An array stores items of one type in consecutive positions and gives fast access by index. A linked list connects items with links, so inserting is easy.', 'اختيار الـ data structure بيأثر جدًا على كفاءة البرنامج. الـ array بيخزن عناصر من نوع واحد في أماكن متتالية وبيدّي وصول سريع بالـ index. والـ linked list بيربط العناصر بروابط، فالإضافة سهلة.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int numbers[5] = {4, 8, 15, 16, 23};\n    cout << numbers[0] << " " << numbers[4] << endl;  // 4 23\n    return 0;\n}\n', ['Array indexes start at 0.', 'الـ index في الـ array بيبدأ من 0.'])),
    S(['Stacks and queues', 'الـ Stacks والـ Queues'], [
      ['A stack is Last-In, First-Out (like a pile of plates): push adds on top, pop removes from the top. A queue is First-In, First-Out (like a line of people): enqueue adds at the back, dequeue removes from the front.', 'الـ stack هو Last-In, First-Out (زي كومة أطباق): push بيضيف فوق و pop بيشيل من فوق. والـ queue هو First-In, First-Out (زي طابور ناس): enqueue بيضيف في الآخر و dequeue بيشيل من الأول.']]),
    S(['Trees, graphs and hash tables', 'الـ Trees والـ Graphs والـ Hash tables'], [
      ['A tree is hierarchical (a file system is a tree). A graph models connections such as roads or social networks. A hash table finds values quickly by turning a key into a position.', 'الـ tree هرمي (الـ file system مثال على tree). والـ graph بيمثّل الروابط زي الطرق أو الشبكات الاجتماعية. والـ hash table بيلاقي القيم بسرعة بتحويل الـ key لمكان.']]),
    S(['Databases', 'قواعد البيانات'], [
      ['A relational database stores data in tables. A primary key uniquely identifies each row; a foreign key links a row to a row in another table. Queries (SQL) retrieve data, and transactions make a group of changes succeed or fail together. NoSQL databases use other models for flexible or huge data.', 'قاعدة البيانات العلائقية بتخزن البيانات في جداول. الـ primary key بيحدد كل صف بشكل فريد؛ والـ foreign key بيربط صف بصف في جدول تاني. الـ Queries (SQL) بتجيب البيانات، والـ transactions بتخلّي مجموعة تغييرات تنجح أو تفشل مع بعض. وقواعد NoSQL بتستخدم نماذج تانية للبيانات المرنة أو الضخمة.']]),
  ] },
/* 8 */ { n: 8, group: 'A', title: ['Computer Networks and the Internet', 'شبكات الكمبيوتر والإنترنت'], blurb: ['Packets, IP addresses, routers, DNS and HTTP.', 'الـ packets وعناوين IP والـ routers والـ DNS والـ HTTP.'], lab: 'packets',
  sections: [
    S(['How data travels', 'البيانات بتسافر إزاي'], [
      ['A network connects devices so they can share data. Messages are split into small packets that travel separately, and routers forward each packet toward its destination, where they are reassembled.', 'الشبكة بتوصّل أجهزة عشان تتبادل البيانات. الرسايل بتتقسّم لـ packets صغيرة بتسافر لوحدها، والـ routers بتوجّه كل packet لوجهته وهناك بيتم تجميعها تاني.']]),
    S(['Addresses and names', 'العناوين والأسماء'], [
      ['Every device has an IP address. People prefer names, so the Domain Name System (DNS) translates a domain name like example.com into an IP address.', 'كل جهاز له IP address. والناس بتفضل الأسماء، فالـ Domain Name System (DNS) بيحوّل اسم دومين زي example.com لعنوان IP.']]),
    S(['The web: HTTP and HTTPS', 'الويب: HTTP و HTTPS'], [
      ['In the client-server model a client (your browser) sends a request using HTTP and the server sends a response. HTTPS does the same but encrypts the communication.', 'في نموذج client-server الـ client (المتصفح) بيبعت طلب بـ HTTP والـ server بيرد. والـ HTTPS بيعمل نفس الشيء لكن بيشفّر الاتصال.']]),
    S(['Performance, security and cloud', 'الأداء والأمان والـ cloud'], [
      ['Network performance is described by bandwidth (how much data per second) and latency (how long it takes to arrive). Security uses encryption, firewalls and authentication. Cloud computing offers storage and computing power over the network.', 'أداء الشبكة بيوصف بالـ bandwidth (كام بيانات في الثانية) والـ latency (الوقت اللي بياخده الوصول). والأمان بيستخدم التشفير والـ firewalls والـ authentication. والـ Cloud computing بيقدم تخزين وقدرة معالجة عبر الشبكة.']]),
  ] },
/* 9 */ { n: 9, group: 'B', title: ['Introduction to Structured Programming and C++', 'مقدمة في البرمجة الهيكلية ولغة C++'], blurb: ['Sequence, selection, iteration — and why C++.', 'الـ Sequence والـ Selection والـ Iteration — وليه C++.'], lab: 'trace9',
  sections: [
    S(['What is structured programming?', 'يعني إيه البرمجة الهيكلية؟'], [
      ['Structured programming emphasizes clear, logical structure to improve readability, maintainability and reliability. Any program can be built from three control structures: Sequence (instructions one after the other), Selection (if, else, switch) and Iteration (for, while loops).', 'البرمجة الهيكلية بتركز على هيكل واضح ومنطقي لتحسين القراءة والصيانة والموثوقية. أي برنامج ممكن يتبني من 3 هياكل تحكم: Sequence (أوامر ورا بعض) و Selection (if و else و switch) و Iteration (لوبات for و while).'],
      ['Before the 1970s much code was "spaghetti code": messy, full of goto jumps and hard to debug. Structured programming fixed this with modularization — breaking a big problem into smaller, manageable tasks.', 'قبل السبعينات كان كتير من الكود "spaghetti code": مبعثر ومليان قفزات goto وصعب الـ debug. البرمجة الهيكلية حلت المشكلة بالـ modularization — تقسيم المشكلة الكبيرة لمهام أصغر سهلة الإدارة.']]),
    S(['Why C++?', 'ليه C++؟'], [
      ['C++ supports structured, object-oriented and generic programming. It is close to hardware, fast and efficient, has a strong syntax and is used in game development, embedded systems and operating systems. Structured programming comes first because OOP builds on it: you must master program flow, variables and logic before classes and objects.', 'لغة C++ بتدعم البرمجة الهيكلية والكائنية والعامة. قريبة من الهاردوير وسريعة وكفؤة وسينتاكسها قوي وبتستخدم في الألعاب والأنظمة المدمجة وأنظمة التشغيل. بنتعلم الهيكلية الأول لأن الـ OOP بيتبني عليها: لازم تتقن تدفق البرنامج والمتغيرات والمنطق قبل الـ classes والـ objects.']]),
    S(['Core principles', 'المبادئ الأساسية'], [
      ['Top-down design: start with the whole task and split it into smaller sub-tasks (for a grade program: input data, process data, output results). Modularity: each module (function) does one job well. Clear flow of control: execution should follow a predictable order.', 'Top-down design: ابدأ بالمهمة كلها وقسّمها لمهام فرعية (في برنامج الدرجات: إدخال البيانات، معالجتها، إخراج النتيجة). Modularity: كل module (function) يعمل شغلة واحدة صح. Clear flow of control: التنفيذ لازم يمشي بترتيب متوقع.']]),
    S(['A structured C++ program', 'برنامج C++ هيكلي'], [
      ['This program follows sequence (input → process → output) and uses selection (if/else). Run it, change the number and watch the result.', 'البرنامج ده بيتبع الـ sequence (مدخلات ← معالجة ← مخرجات) وبيستخدم الـ selection (if/else). شغّله وغيّر الرقم وشوف النتيجة.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int number;\n    cout << "Enter a number: ";\n    cin >> number;\n    if (number % 2 == 0) {\n        cout << number << " is even." << endl;\n    } else {\n        cout << number << " is odd." << endl;\n    }\n    return 0;\n}\n', ['Type a number in the input box under the code, then press Run.', 'اكتب رقم في خانة الإدخال تحت الكود وبعدين اضغط Run.'])),
    S(['The development process and tools', 'خطوات التطوير والأدوات'], [
      ['Six steps: define the problem, plan the solution (flowchart or pseudocode), write the code, compile and test, debug logic errors, then refine. You need a compiler (GCC, MSVC), an IDE (Code::Blocks, Visual Studio, Dev-C++) or a text editor (VS Code, Sublime Text).', 'ست خطوات: حدد المشكلة، خطط الحل (flowchart أو pseudocode)، اكتب الكود، compile واختبر، صلّح أخطاء المنطق، وبعدين حسّن. محتاج compiler (GCC أو MSVC) و IDE (Code::Blocks أو Visual Studio أو Dev-C++) أو محرر نصوص (VS Code أو Sublime Text).'],
      ['Common beginner mistakes: coding without planning, overusing global variables, ignoring indentation, skipping comments, and learning too many concepts at once.', 'أخطاء المبتدئين الشائعة: الكتابة من غير تخطيط، الإفراط في المتغيرات global، تجاهل الـ indentation، تخطي التعليقات، وتعلم مفاهيم كتير مرة واحدة.']]),
  ] },
/* 10 */ { n: 10, group: 'B', title: ['Understanding the Basics of C++ Syntax', 'فهم أساسيات سينتاكس C++'], blurb: ['The anatomy of a program, syntax rules, input and output.', 'تشريح البرنامج وقواعد السينتاكس والإدخال والإخراج.'], lab: 'anatomy',
  sections: [
    S(['Structure of a simple program', 'هيكل برنامج بسيط'], [
      ['Syntax is the grammar of a programming language. C++ is precise: a missing semicolon or a wrong capital letter causes an error. This is the most basic program:', 'الـ Syntax هو قواعد لغة البرمجة. لغة C++ دقيقة: semicolon ناقص أو حرف كابيتال غلط بيعمل error. ده أبسط برنامج:']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, World!" << endl;\n    return 0;\n}\n', ['Press Run to see the output.', 'اضغط Run عشان تشوف الناتج.'])),
    S(['Line by line', 'سطر سطر'], [
      ['#include <iostream> is a preprocessor directive that brings in the input/output library (cout, cin). using namespace std; lets you write cout instead of std::cout. int main() is the entry point where execution begins; the braces { } mark its block. cout << sends data to the screen, endl starts a new line, ; ends the statement, and return 0; reports successful completion.', '#include <iostream> هو أمر preprocessor بيجيب مكتبة الإدخال والإخراج (cout و cin). using namespace std; بتخليك تكتب cout بدل std::cout. int main() هي نقطة البداية اللي بيبدأ منها التنفيذ؛ والأقواس { } بتحدد البلوك بتاعها. cout << بتبعت البيانات للشاشة، و endl بتنزل سطر جديد، و ; بتنهي الجملة، و return 0; بتبلّغ إن البرنامج خلص بنجاح.']]),
    S(['Basic syntax rules', 'قواعد السينتاكس الأساسية'], [
      ['C++ is case-sensitive: Main, main and MAIN are different. Most statements end with ;. Whitespace is mostly ignored, but good formatting makes code readable. Comments are ignored by the compiler: // for one line, /* ... */ for many lines.', 'لغة C++ بتفرّق بين الحروف الكبيرة والصغيرة: Main و main و MAIN مختلفين. أغلب الجمل بتنتهي بـ ;. المسافات غالبًا بتتجاهل، لكن التنسيق الكويس بيخلي الكود مقروء. التعليقات الـ compiler بيتجاهلها: // لسطر واحد و /* ... */ لعدة سطور.']]),
    S(['Variables, identifiers and types', 'المتغيرات والـ identifiers والأنواع'], [
      ['A variable needs a type before use: int age = 25;. Identifier rules: start with a letter or underscore, contain letters, digits and underscores, no spaces or symbols like @ or $, and never a keyword. Valid: myNumber, _value, total_2. Invalid: 2value, total-cost, while.', 'المتغير محتاج نوع قبل الاستخدام: int age = 25;. قواعد الـ identifier: يبدأ بحرف أو underscore، ويحتوي حروف وأرقام وunderscore، من غير مسافات أو رموز زي @ أو $، وماينفعش يكون keyword. صح: myNumber و _value و total_2. غلط: 2value و total-cost و while.'],
      ['Basic types: int (whole numbers, 4 bytes), float (decimal, 4 bytes), double (decimal with more precision, 8 bytes), char (one character, 1 byte), bool (true/false, 1 byte) and string (text).', 'الأنواع الأساسية: int (أعداد صحيحة، 4 bytes) و float (عشري، 4 bytes) و double (عشري بدقة أعلى، 8 bytes) و char (حرف واحد، 1 byte) و bool (true/false، 1 byte) و string (نص).']]),
    S(['Input and output', 'الإدخال والإخراج'], [
      ['cout prints and cin reads. A constant is a variable that cannot change after initialization: const double PI = 3.14159;. Here is a complete program that combines everything:', 'cout بتطبع و cin بتقرأ. الـ constant هو متغير مايتغيّرش بعد ما ياخد قيمته: const double PI = 3.14159;. ده برنامج كامل بيجمع كل حاجة:']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    const double PI = 3.14159;\n    double radius;\n    cout << "Enter the radius of the circle: ";\n    cin >> radius;\n    double area = PI * radius * radius;\n    cout << "The area is: " << area << endl;\n    return 0;\n}\n', ['Try radius 2 — you should get 12.5664.', 'جرّب نصف قطر 2 — المفروض تطلع 12.5664.'])),
  ] },
/* 11 */ { n: 11, group: 'B', title: ['Data Types, Variables, and Constants', 'أنواع البيانات والمتغيرات والثوابت'], blurb: ['Memory sizes, declaring variables, scope, constants and casting.', 'أحجام الذاكرة وتعريف المتغيرات والـ scope والثوابت والـ casting.'], lab: 'memory',
  sections: [
    S(['What is a data type?', 'يعني إيه نوع بيانات؟'], [
      ['A data type tells the compiler what kind of data a variable stores, which decides how much memory it uses, the range of values it can hold and the operations allowed. Fundamental types: int, float, double, char, bool and void (for functions that return nothing). Derived types are built from them: arrays, pointers, references. User-defined types: struct, class, enum.', 'نوع البيانات بيقول للـ compiler المتغير بيخزن إيه، وده بيحدد كام ذاكرة بياخد ومدى القيم اللي يشيلها والعمليات المسموحة. الأنواع الأساسية: int و float و double و char و bool و void (للدوال اللي مابترجعش حاجة). الأنواع المشتقة بتتبني منها: arrays و pointers و references. وأنواع يعرّفها المبرمج: struct و class و enum.'],
      ['Actual sizes can vary by system and compiler.', 'الأحجام الفعلية ممكن تختلف حسب النظام والـ compiler.']]),
    S(['Declaring and initializing variables', 'تعريف المتغيرات وإعطاؤها قيمة'], [
      ['The format is data_type variable_name;. You can assign a value at declaration or later, and declare several variables of one type in one line.', 'الصيغة هي data_type variable_name;. تقدر تدّي قيمة وقت التعريف أو بعدين، وتعرّف كذا متغير من نفس النوع في سطر واحد.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int score = 100;          // declare + initialize\n    int level;                // declare\n    level = 3;                // assign later\n    int x = 5, y = 10, z = 15; // many at once\n    cout << score << " " << level << " " << x + y + z << endl;\n    return 0;\n}\n')),
    S(['Naming, scope and lifetime', 'التسمية والـ scope وعمر المتغير'], [
      ['Use meaningful names (totalPrice is better than tp) and follow the identifier rules. Scope decides where a variable is visible and lifetime decides how long it exists. Local variables live inside a function or block. Global variables are declared outside all functions and are visible everywhere (use them sparingly). Static variables keep their value between calls.', 'استخدم أسماء ذات معنى (totalPrice أحسن من tp) والتزم بقواعد الـ identifier. الـ Scope بيحدد المتغير شايفه فين، والـ lifetime بيحدد عايش قد إيه. المتغيرات Local عايشة جوه الدالة أو البلوك. المتغيرات Global معرّفة برا كل الدوال ومرئية في كل مكان (استخدمها بحذر). والمتغيرات Static بتحتفظ بقيمتها بين النداءات.']],
      code('#include <iostream>\nusing namespace std;\n\nvoid counter() {\n    static int count = 0;  // created once, keeps its value\n    count++;\n    cout << count << endl;\n}\n\nint main() {\n    counter();\n    counter();\n    counter();\n    return 0;\n}\n', ['Calling counter() three times prints 1, 2, 3.', 'نداء counter() تلات مرات بيطبع 1 و 2 و 3.'])),
    S(['Constants, literals and modifiers', 'الثوابت والـ literals والـ modifiers'], [
      ['A constant cannot change after initialization: const double PI = 3.14159; (changing PI is a compile error). #define PI 3.14159 replaces PI before compilation, but const is preferred because it has type checking. Literals are fixed values written in code: 42, 3.14, \'A\', "Hello", true. Modifiers change size or sign: signed, unsigned, short, long.', 'الثابت مايتغيّرش بعد التعريف: const double PI = 3.14159; (تغيير PI بيعمل compile error). و #define PI 3.14159 بتستبدل PI قبل الـ compilation، لكن const أفضل لأن فيه فحص للنوع. الـ Literals هي قيم ثابتة مكتوبة في الكود: 42 و 3.14 و \'A\' و "Hello" و true. والـ Modifiers بتغير الحجم أو الإشارة: signed و unsigned و short و long.']]),
    S(['Type casting', 'تحويل الأنواع (Casting)'], [
      ['Implicit casting is automatic (int → double). Explicit casting is done by you, using the C-style (int)pi or the modern static_cast<int>(pi). Converting a decimal to int drops the fractional part.', 'الـ Implicit casting بيحصل تلقائيًا (int ← double). والـ Explicit casting بتعمله انت باستخدام الشكل القديم (int)pi أو الحديث static_cast<int>(pi). تحويل عشري لـ int بيشيل الجزء العشري.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int x = 10;\n    double y = x;                 // implicit: 10 -> 10.0\n    double pi = 3.14;\n    int approx = (int)pi;         // C-style\n    int approx2 = static_cast<int>(pi);\n    cout << y << " " << approx << " " << approx2 << endl;\n    return 0;\n}\n')),
    S(['Common mistakes', 'أخطاء شائعة'], [
      ['Forgetting to initialize variables (they may hold garbage values), using the wrong data type (storing 3.14 in an int), confusing = (assignment) with == (comparison), and changing a constant.', 'نسيان إعطاء قيمة ابتدائية للمتغيرات (ممكن تحمل قيم عشوائية)، استخدام نوع بيانات غلط (تخزين 3.14 في int)، لخبطة بين = (إسناد) و == (مقارنة)، وتغيير قيمة constant.']]),
  ] },
/* 12 */ { n: 12, group: 'B', title: ['Operators and Expressions in C++', 'العمليات والتعبيرات في C++'], blurb: ['Arithmetic, comparison, logic, increment and precedence.', 'العمليات الحسابية والمقارنة والمنطق والزيادة والأولويات.'], lab: 'expr',
  sections: [
    S(['Operators and expressions', 'الـ Operators والـ Expressions'], [
      ['Operators are symbols that perform operations (+, -, *, /). An expression combines variables, constants and operators and evaluates to a value. In int x = 5 + 3;, the expression is 5 + 3, the operator is + and 5 and 3 are operands.', 'الـ Operators رموز بتنفذ عمليات (+ و - و * و /). والـ Expression هو تجميعة من متغيرات وثوابت وoperators بتتحول لقيمة. في int x = 5 + 3; التعبير هو 5 + 3 والـ operator هو + و 5 و 3 هم الـ operands.']]),
    S(['Arithmetic and assignment operators', 'عمليات الحساب والإسناد'], [
      ['Arithmetic: + - * / and % (remainder). Assignment: = += -= *= /= %=, where x += 3 means x = x + 3.', 'الحساب: + - * / و % (الباقي). الإسناد: = += -= *= /= %=، حيث x += 3 معناها x = x + 3.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int a = 10, b = 3;\n    cout << a + b << endl;   // 13\n    cout << a % b << endl;   // 1\n    int x = 10;\n    x += 5;                  // 15\n    x *= 2;                  // 30\n    cout << x << endl;\n    return 0;\n}\n')),
    S(['Comparison and logical operators', 'عمليات المقارنة والمنطق'], [
      ['Relational operators (==, !=, <, >, <=, >=) give true (1) or false (0). Logical operators combine conditions: && (AND), || (OR) and ! (NOT).', 'عمليات المقارنة (== و != و < و > و <= و >=) بترجّع true (1) أو false (0). والعمليات المنطقية بتجمع شروط: && (AND) و || (OR) و ! (NOT).']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int age = 20;\n    bool hasID = true;\n    if (age >= 18 && hasID) {\n        cout << "Entry allowed" << endl;\n    }\n    cout << (5 < 10) << " " << (5 == 10) << endl;  // 1 0\n    return 0;\n}\n')),
    S(['Increment, decrement and other operators', 'الزيادة والنقصان وعمليات تانية'], [
      ['++ and -- change a variable by 1. Pre-increment (++x) changes the value first and then uses it; post-increment (x++) uses the value first and then changes it. Also: the ternary operator condition ? a : b (a compact if-else), sizeof (size in bytes), the comma operator and the bitwise operators (& | ^ ~ << >>).', 'الـ ++ و -- بتغيّر المتغير بمقدار 1. الـ Pre-increment (++x) بيغيّر القيمة الأول وبعدين يستخدمها؛ والـ post-increment (x++) بيستخدم القيمة الأول وبعدين يغيّرها. وكمان: العامل الثلاثي condition ? a : b (if-else مختصرة) و sizeof (الحجم بالـ bytes) والـ comma operator وعمليات الـ bitwise (& | ^ ~ << >>).']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int x = 5;\n    cout << x++ << endl;  // prints 5, then x becomes 6\n    cout << ++x << endl;  // x becomes 7, then prints 7\n    int age = 20;\n    string result = (age >= 18) ? "Adult" : "Minor";\n    cout << result << endl;\n    cout << sizeof(int) << endl;  // typically 4\n    return 0;\n}\n')),
    S(['Precedence and common mistakes', 'الأولويات وأخطاء شائعة'], [
      ['Precedence decides which operator is evaluated first: 5 + 2 * 3 is 11 because * comes before +. Order from highest to lowest: ( ), ++ -- !, * / %, + -, < <= > >=, == !=, &&, ||, ?:, assignment. When unsure, use parentheses.', 'الأولوية بتحدد أنهي operator يتنفذ الأول: 5 + 2 * 3 بتساوي 11 لأن * بتيجي قبل +. الترتيب من الأعلى للأقل: ( ) ثم ++ -- ! ثم * / % ثم + - ثم < <= > >= ثم == != ثم && ثم || ثم ?: ثم الإسناد. ولو مش متأكد استخدم الأقواس.'],
      ['Classic mistakes: integer division (5 / 2 is 2, not 2.5 — make one side a decimal, like 5 / 2.0), confusing = with ==, ignoring precedence, and misusing i++ versus ++i.', 'أخطاء كلاسيكية: القسمة الصحيحة (5 / 2 بتساوي 2 مش 2.5 — خلّي طرف عشري زي 5 / 2.0)، لخبطة = و ==، تجاهل الأولويات، وسوء استخدام i++ مقابل ++i.']]),
  ] },
/* 13 */ { n: 13, group: 'B', title: ['Control Structures: Decision-Making Statements', 'هياكل التحكم: جمل اتخاذ القرار'], blurb: ['if, if-else, ladders, nested if, switch and the ternary operator.', 'الـ if و if-else والسلالم والـ nested if والـ switch والعامل الثلاثي.'], lab: 'ladder',
  sections: [
    S(['Programs must decide', 'البرامج لازم تقرر'], [
      ['A program makes decisions based on data: if a password is correct let the user in; if the temperature is above 30 turn on the air conditioner; if a number is even print "Even", otherwise "Odd".', 'البرنامج بياخد قرارات على حسب البيانات: لو الباسورد صح اسمح بالدخول؛ لو الحرارة فوق 30 شغّل التكييف؛ لو الرقم زوجي اطبع "Even" وغير كده "Odd".']]),
    S(['if and if-else', 'الـ if والـ if-else'], [
      ['if runs its block only when the condition is true. if-else runs one block when true and another when false.', 'الـ if بتنفذ البلوك بتاعها بس لما الشرط يتحقق. والـ if-else بتنفذ بلوك لو صح وبلوك تاني لو غلط.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int number;\n    cin >> number;\n    if (number > 0) {\n        cout << "The number is positive." << endl;\n    }\n    if (number % 2 == 0) {\n        cout << "Even number" << endl;\n    } else {\n        cout << "Odd number" << endl;\n    }\n    return 0;\n}\n', ['Try 4, then 7, then -3.', 'جرّب 4 وبعدين 7 وبعدين -3.'])),
    S(['The if-else-if ladder', 'سلم if-else-if'], [
      ['To test several conditions in sequence, chain them. The first true condition wins and the rest are skipped, so start from the strictest one.', 'لو عايز تختبر شروط كتير ورا بعض، اربطهم. أول شرط يتحقق بيكسب وباقي الشروط بتتخطى، فابدأ بالأصعب.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int marks;\n    cin >> marks;\n    if (marks >= 90) {\n        cout << "Grade A" << endl;\n    } else if (marks >= 75) {\n        cout << "Grade B" << endl;\n    } else if (marks >= 50) {\n        cout << "Grade C" << endl;\n    } else {\n        cout << "Fail" << endl;\n    }\n    return 0;\n}\n', ['Try 95, 80, 60 and 20.', 'جرّب 95 و 80 و 60 و 20.'])),
    S(['Nested if', 'الـ Nested if'], [
      ['An if inside another if is a nested if. Avoid unnecessary nesting: simplify the logic where possible.', 'الـ if جوه if تانية اسمها nested if. تجنب التداخل غير الضروري: بسّط المنطق لو ممكن.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int age;\n    bool citizen = true;\n    cin >> age;\n    if (age >= 18) {\n        if (citizen == true) {\n            cout << "You are eligible to vote." << endl;\n        } else {\n            cout << "You must be a citizen to vote." << endl;\n        }\n    } else {\n        cout << "You are not eligible to vote." << endl;\n    }\n    return 0;\n}\n')),
    S(['switch and the ternary operator', 'الـ switch والعامل الثلاثي'], [
      ['switch picks code by the value of one expression. Each case should end with break, otherwise execution falls through to the next case. default runs when nothing matches. The ternary operator condition ? a : b is a shorthand for a simple if-else.', 'الـ switch بتختار الكود حسب قيمة تعبير واحد. كل case لازم تنتهي بـ break وإلا التنفيذ بيكمل في الـ case اللي بعدها (fall-through). والـ default بتشتغل لو مفيش تطابق. والعامل الثلاثي condition ? a : b اختصار لـ if-else بسيطة.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int day = 3;\n    switch (day) {\n        case 1: cout << "Monday"; break;\n        case 2: cout << "Tuesday"; break;\n        case 3: cout << "Wednesday"; break;\n        default: cout << "Invalid day";\n    }\n    cout << endl;\n    int num = 5;\n    string result = (num % 2 == 0) ? "Even" : "Odd";\n    cout << result << endl;\n    return 0;\n}\n', ['Delete a break; and run again to see fall-through.', 'امسح break; وشغّل تاني عشان تشوف الـ fall-through.'])),
    S(['Common mistakes', 'أخطاء شائعة'], [
      ['Using = instead of == (if (x = 5) assigns 5 to x and is always true), forgetting break in a switch, and unnecessary nesting.', 'استخدام = بدل == (الجملة if (x = 5) بتحط 5 في x ودايمًا بتبقى true)، نسيان break في الـ switch، والتداخل غير الضروري.']]),
  ] },
/* 14 */ { n: 14, group: 'B', title: ['Loops and Iterations', 'اللوبات والتكرار'], blurb: ['for, while, do-while, break, continue and nested loops.', 'الـ for و while و do-while و break و continue واللوبات المتداخلة.'], lab: 'loops',
  sections: [
    S(['Why loops?', 'ليه اللوبات؟'], [
      ['A loop repeats a block of code until a condition stops it; each repetition is an iteration. Loops automate repetitive tasks, control repetition dynamically and keep code short.', 'اللوب بيكرر بلوك كود لحد ما شرط يوقفه؛ وكل تكرار اسمه iteration. اللوبات بتأتمت المهام المتكررة وبتتحكم في التكرار ديناميكيًا وبتخلي الكود قصير.']]),
    S(['The for loop', 'لوب for'], [
      ['Use for when you know the number of iterations. Initialization runs once at the start, the condition is checked before every iteration, and the update changes the loop variable after each one.', 'استخدم for لما تعرف عدد التكرارات. الـ Initialization بتشتغل مرة في الأول، والـ condition بتتفحص قبل كل تكرار، والـ update بتغيّر متغير اللوب بعد كل تكرار.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    for (int i = 1; i <= 5; i++) {\n        cout << "Iteration " << i << endl;\n    }\n    return 0;\n}\n')),
    S(['while and do-while', 'لوب while و do-while'], [
      ['while is used when the number of iterations is not known beforehand: it checks the condition first. do-while checks the condition after the body, so the body always runs at least once.', 'الـ while بتتستخدم لما عدد التكرارات مش معروف مسبقًا: بتفحص الشرط الأول. والـ do-while بتفحص الشرط بعد الجسم، فالجسم بيتنفذ مرة على الأقل دايمًا.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    int count = 1;\n    while (count <= 3) {\n        cout << "Count: " << count << endl;\n        count++;\n    }\n    int number = 10;\n    do {\n        cout << "Number: " << number << endl;  // runs once\n        number++;\n    } while (number <= 5);\n    return 0;\n}\n', ['The do-while body ran once even though 11 <= 5 is false.', 'جسم الـ do-while اتنفذ مرة مع إن الشرط غلط.'])),
    S(['break, continue and nested loops', 'الـ break والـ continue واللوبات المتداخلة'], [
      ['break exits the loop immediately; continue skips to the next iteration; goto exists but is not recommended in structured programming. A loop inside a loop is a nested loop — useful for tables and matrices. An infinite loop never stops unless it hits a break.', 'الـ break بتخرج من اللوب فورًا؛ والـ continue بتتخطى للتكرار اللي بعده؛ و goto موجودة لكن مش مفضلة في البرمجة الهيكلية. لوب جوه لوب اسمها nested loop — مفيدة للجداول والمصفوفات. واللوب اللانهائي مابيوقفش إلا لو وصل لـ break.']],
      code('#include <iostream>\nusing namespace std;\n\nint main() {\n    for (int i = 1; i <= 10; i++) {\n        if (i == 5) { continue; }  // skip 5\n        if (i == 8) { break; }     // stop at 8\n        cout << i << " ";\n    }\n    cout << endl;\n    for (int i = 1; i <= 3; i++) {\n        for (int j = 1; j <= 3; j++) {\n            cout << "(" << i << ", " << j << ") ";\n        }\n        cout << endl;\n    }\n    return 0;\n}\n')),
    S(['Best practices', 'أفضل الممارسات'], [

  ] },
/* 15 */ { n: 15, group: 'B', title: ['Functions: Modularizing Your Code', 'الدوال: تقسيم الكود لوحدات'], blurb: ['Prototypes, parameters, references, defaults, overloading, inline and recursion.', 'الـ prototypes والـ parameters والـ references والقيم الافتراضية والـ overloading والـ inline والـ recursion.'], lab: 'callstack',
  sections: [
    S(['What is a function?', 'يعني إيه function؟'], [
      ['A function is a reusable group of statements that performs a defined task and can return a value to its caller. Functions avoid code duplication, make programs easier to debug and update, improve readability and allow reuse. Library functions come with C++ (sqrt(), pow() from <cmath>); user-defined functions are written by you.', 'الـ function هي مجموعة جمل قابلة لإعادة الاستخدام بتنفذ مهمة محددة وممكن ترجّع قيمة للي ناداها. الدوال بتمنع تكرار الكود وبتسهّل الـ debug والتحديث وبتحسّن القراءة وبتسمح بإعادة الاستخدام. دوال المكتبة جاية مع C++ (زي sqrt() و pow() من <cmath>)؛ والدوال اللي بتكتبها انت اسمها user-defined.']]),
    S(['Declaration, definition and call', 'التصريح والتعريف والنداء'], [
      ['A function has a declaration (prototype: name, return type, parameters), a definition (the body) and calls. The prototype lets you call the function from main even when its body is written below main. Without it, the compiler stops at the call.', 'الدالة ليها declaration (الـ prototype: الاسم ونوع الرجوع والـ parameters) و definition (الجسم) و calls (نداءات). الـ prototype بيخليك تنادي الدالة من main حتى لو جسمها مكتوب تحت main. من غيره الـ compiler بيقف عند النداء.']],
      code('#include <iostream>\nusing namespace std;\n\nint addNumbers(int a, int b);   // declaration (prototype)\n\nint main() {\n    int result = addNumbers(5, 7);  // call\n    cout << "Sum: " << result << endl;\n    return 0;\n}\n\nint addNumbers(int a, int b) {  // definition\n    return a + b;\n}\n', ['Delete the prototype line and run: the checker reports the same error a real compiler would.', 'امسح سطر الـ prototype وشغّل: الفاحص هيطلّع نفس الخطأ اللي الـ compiler الحقيقي بيطلّعه.'])),
    S(['Parameters: by value and by reference', 'الـ Parameters: بالقيمة وبالـ reference'], [
      ['Pass by value copies the argument, so changes do not affect the original variable. Pass by reference (int &num) works on the original variable itself. A function returns one value with return; if it returns nothing, its type is void.', 'الـ Pass by value بينسخ الـ argument، فالتغييرات ما بتأثرش على المتغير الأصلي. والـ Pass by reference (int &num) بيشتغل على المتغير الأصلي نفسه. والدالة بترجّع قيمة واحدة بـ return؛ ولو مابترجّعش حاجة نوعها void.']],
      code('#include <iostream>\nusing namespace std;\n\nvoid increase(int &num) {\n    num++;\n}\n\nint main() {\n    int x = 5;\n    increase(x);\n    cout << "x after increase: " << x << endl;  // 6\n    return 0;\n}\n', ['Remove the & and run again — x stays 5.', 'شيل علامة & وشغّل تاني — x هتفضل 5.'])),
    S(['Default arguments and overloading', 'القيم الافتراضية والـ Overloading'], [
      ['A default argument lets a call omit a parameter. Overloading means several functions share one name but have different parameter lists; the compiler picks the right one from the arguments.', 'القيمة الافتراضية بتسمح للنداء إنه يحذف parameter. والـ Overloading معناه إن كذا دالة ليهم نفس الاسم لكن قايمة parameters مختلفة؛ والـ compiler بيختار المناسبة من الـ arguments.']],
      code('#include <iostream>\nusing namespace std;\n\nvoid displayMessage(string message = "Hello World") {\n    cout << message << endl;\n}\n\nint multiply(int a, int b) { return a * b; }\ndouble multiply(double a, double b) { return a * b; }\n\nint main() {\n    displayMessage();\n    displayMessage("Hi there!");\n    cout << multiply(3, 4) << endl;\n    cout << multiply(2.5, 4.1) << endl;\n    return 0;\n}\n')),
    S(['Inline and recursive functions', 'الدوال الـ inline والـ recursive'], [
      ['An inline function suggests that the compiler insert its code directly at each call, which can be faster for small functions. A recursive function calls itself; it needs a base case that stops the recursion. Typical uses: factorial, Fibonacci and tree traversal.', 'الدالة الـ inline بتقترح على الـ compiler إنه يحط كودها مباشرة عند كل نداء، وده ممكن يبقى أسرع للدوال الصغيرة. والدالة الـ recursive بتنادي نفسها؛ ومحتاجة base case توقف التكرار. استخدامات شائعة: factorial و Fibonacci والتنقل في الـ trees.']],
      code('#include <iostream>\nusing namespace std;\n\ninline int square(int x) {\n    return x * x;\n}\n\nint factorial(int n) {\n    if (n <= 1)\n        return 1;           // base case\n    else\n        return n * factorial(n - 1);\n}\n\nint main() {\n    cout << square(7) << endl;\n    cout << "Factorial of 5: " << factorial(5) << endl;\n    return 0;\n}\n', ['Watch the call stack animation above to see how factorial(5) unwinds.', 'اتفرج على أنيميشن الـ call stack اللي فوق عشان تشوف إزاي factorial(5) بتتفك.'])),
  ] },
];

root.CONTENT = { CHAPTERS };

<script>/* Animated labs. Each lab explains one idea from its chapter. Captions are bilingual: [English, Arabic]. */
(function (root) {
'use strict';
const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function captionBox() {
  const box = $('div', 'cap');
  const en = $('p', 'cap-en'), ar = $('p', 'cap-ar'); ar.dir = 'rtl'; ar.lang = 'ar';
  box.append(en, ar);
  box.set = (t) => { en.innerHTML = t[0]; ar.innerHTML = t[1]; };
  return box;
}

/* generic stepper controls: render(i) must be pure (state derived from i) */
function stepper(host, n, render, opts) {
  opts = opts || {};
  const ctrl = $('div', 'lab-ctrl');
  const bPrev = $('button', 'btn ghost', 'Back'), bPlay = $('button', 'btn primary', 'Play'), bNext = $('button', 'btn ghost', 'Next'), bReset = $('button', 'btn ghost', 'Restart');
  [bPrev, bPlay, bNext, bReset].forEach(b => { b.type = 'button'; });
  const dots = $('div', 'dots');
  for (let k = 0; k < n; k++) { const d = $('button', 'dot'); d.type = 'button'; d.setAttribute('aria-label', 'Step ' + (k + 1)); d.onclick = () => { stop(); go(k); }; dots.append(d); }
  ctrl.append(bPrev, bPlay, bNext, bReset, dots);
  const cap = captionBox();
  host.append(cap, ctrl);
  let i = 0, timer = null;
  const go = k => {
    i = Math.max(0, Math.min(n - 1, k));
    cap.set(render(i));
    [...dots.children].forEach((d, j) => { d.classList.toggle('on', j === i); d.classList.toggle('past', j < i); });
    bPrev.disabled = i === 0; bNext.disabled = i === n - 1;
  };
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } bPlay.textContent = 'Play'; };
  const play = () => {
    if (timer) { stop(); return; }
    if (i >= n - 1) go(0);
    bPlay.textContent = 'Pause';
    timer = setInterval(() => { if (i >= n - 1) { stop(); return; } go(i + 1); }, opts.ms || 1700);
  };
  bPrev.onclick = () => { stop(); go(i - 1); };
  bNext.onclick = () => { stop(); go(i + 1); };
  bReset.onclick = () => { stop(); go(0); };
  bPlay.onclick = play;
  go(0);
  return { go, stop, setN: null, current: () => i };
}

/* ---------- Chapter 1: binary search ---------- */
function binsearch(host) {
  const arr = [2, 5, 8, 11, 14, 17, 21, 25, 29, 33, 38, 42, 47, 51, 56, 60], target = 42;
  const steps = [{ lo: 0, hi: 15, mid: -1, kind: 'start' }];
  let lo = 0, hi = arr.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid] === target) { steps.push({ lo, hi, mid, kind: 'found' }); break; }
    steps.push({ lo, hi, mid, kind: arr[mid] < target ? 'right' : 'left' });
    if (arr[mid] < target) lo = mid + 1; else hi = mid - 1;
  }
  const stage = $('div', 'stage bs');
  stage.innerHTML = '<div class="bs-target">Looking for <b>' + target + '</b> in a sorted list</div>';
  const row = $('div', 'bs-row');
  const cells = arr.map(v => { const c = $('div', 'bs-cell', '<span>' + v + '</span>'); row.append(c); return c; });
  stage.append(row);
  host.append(stage);
  stepper(host, steps.length, i => {
    const s = steps[i];
    cells.forEach((c, k) => {
      c.className = 'bs-cell' + (k < s.lo || k > s.hi ? ' out' : '') + (k === s.mid ? (s.kind === 'found' ? ' found' : ' mid') : '');
    });
    const checked = i;
    if (s.kind === 'start') return ['The list is sorted. Checking one by one could take 16 looks. Binary search needs only a few.', 'القايمة مرتبة. الفحص واحد واحد ممكن ياخد 16 نظرة. الـ binary search محتاج كام نظرة بس.'];
    const v = arr[s.mid];
    if (s.kind === 'found') return ['Middle = <b>' + v + '</b> — that is the target! Found after <b>' + checked + '</b> checks instead of 12.', 'اللي في النص = <b>' + v + '</b> — ده المطلوب! اتلاقى بعد <b>' + checked + '</b> فحوصات بدل 12.'];
    return s.kind === 'right'
      ? ['Check the middle: <b>' + v + '</b> is smaller than ' + target + ', so throw away the left half.', 'افحص اللي في النص: <b>' + v + '</b> أصغر من ' + target + '، يبقى نشيل النص الشمال.']
      : ['Check the middle: <b>' + v + '</b> is bigger than ' + target + ', so throw away the right half.', 'افحص اللي في النص: <b>' + v + '</b> أكبر من ' + target + '، يبقى نشيل النص اليمين.'];
  });
}

/* ---------- Chapter 2: computers shrink ---------- */
function timeline(host) {
  const eras = [
    { y: '1830s', n: 'Analytical Engine', s: 120, p: 1, en: 'A mechanical design with gears: input, processing, memory and output ideas — but never fully built in Babbage\'s time.', ar: 'تصميم ميكانيكي بالتروس: فيه أفكار المدخلات والمعالجة والذاكرة والمخرجات — لكنه ماتبنيش بالكامل في زمن بابّاج.' },
    { y: '1940s', n: 'Vacuum tubes', s: 100, p: 2, en: 'Early electronic computers filled whole rooms and used thousands of hot, fragile vacuum tubes.', ar: 'الكمبيوترات الإلكترونية المبكرة كانت بتملأ أوض كاملة وبتستخدم آلاف الصمامات المفرغة السخنة والهشة.' },
    { y: '1950s', n: 'Transistors', s: 70, p: 3, en: 'Transistors replaced tubes: smaller, cheaper, cooler and far more reliable.', ar: 'الترانزستورات حلت محل الصمامات: أصغر وأرخص وأبرد وأكثر اعتمادية بكتير.' },
    { y: '1960s', n: 'Integrated circuits', s: 45, p: 5, en: 'Many transistors on a single chip made computers smaller and faster.', ar: 'ترانزستورات كتير على شريحة واحدة خلّت الكمبيوتر أصغر وأسرع.' },
    { y: '1970s', n: 'Microprocessor', s: 28, p: 7, en: 'A whole CPU on one chip — this made the personal computer possible.', ar: 'CPU كامل على شريحة واحدة — وده خلّى الكمبيوتر الشخصي ممكن.' },
    { y: '2000s', n: 'Smartphone & cloud', s: 18, p: 10, en: 'Powerful, connected computers fit in a pocket, backed by cloud data centers.', ar: 'كمبيوترات قوية ومتصلة بتتحط في الجيب، ومدعومة بمراكز بيانات سحابية.' },
  ];
  const stage = $('div', 'stage tl');
  const items = eras.map(e => {
    const it = $('div', 'tl-item');
    it.innerHTML = '<div class="tl-box"><i style="--s:' + e.s + 'px"></i></div><div class="tl-y">' + e.y + '</div><div class="tl-n">' + e.n + '</div><div class="tl-p"><b style="--p:' + e.p * 10 + '%"></b></div>';
    stage.append(it); return it;
  });
  stage.insertAdjacentHTML('afterbegin', '<div class="tl-key"><span>Size of the machine</span><span>Power</span></div>');
  host.append(stage);
  stepper(host, eras.length, i => {
    items.forEach((it, k) => { it.classList.toggle('on', k === i); it.classList.toggle('past', k < i); it.classList.toggle('future', k > i); });
    return [eras[i].en, eras[i].ar];
  });
}

/* ---------- Chapter 3: fetch - decode - execute ---------- */
function cpu(host) {
  const stage = $('div', 'stage cpu');
  stage.innerHTML = '<div class="cpu-box" id="cpuB"><h4>CPU</h4><div class="reg">IR <b id="rIR">—</b></div><div class="reg">ACC <b id="rACC">0</b></div></div>' +
    '<div class="bus"><span class="pkt" id="pkt"></span></div>' +
    '<div class="ram-box" id="ramB"><h4>RAM</h4><div class="cell" data-i="0">0: LOAD 2</div><div class="cell" data-i="1">1: ADD 3</div><div class="cell" data-i="2">2: STORE x</div><div class="cell x" data-i="3">x = <b id="vx">?</b></div></div>';
  host.append(stage);
  const q = id => stage.querySelector('#' + id);
  const S = [
    { t: ['The program <b>x = 2 + 3</b> is stored in RAM as three instructions. The CPU will run them one at a time.', 'البرنامج <b>x = 2 + 3</b> متخزن في الـ RAM كـ 3 أوامر. الـ CPU هينفذهم واحد واحد.'], ir: '—', acc: 0, x: '?', pos: 'ram', cell: -1, hot: '' },
    { t: ['<b>Fetch</b>: the instruction in cell 0 travels from RAM over the bus into the CPU.', '<b>Fetch</b>: الأمر اللي في الخانة 0 بيسافر من الـ RAM عبر الـ bus للـ CPU.'], ir: 'LOAD 2', acc: 0, x: '?', pos: 'cpu', cell: 0, hot: 'cpu' },
    { t: ['<b>Decode + Execute</b>: LOAD 2 puts the value 2 into the accumulator (ACC).', '<b>Decode + Execute</b>: الأمر LOAD 2 بيحط القيمة 2 في الـ accumulator (ACC).'], ir: 'LOAD 2', acc: 2, x: '?', pos: 'cpu', cell: 0, hot: 'cpu' },
    { t: ['<b>Fetch</b> again: the next instruction, ADD 3, arrives from cell 1.', '<b>Fetch</b> تاني: الأمر اللي بعده ADD 3 وصل من الخانة 1.'], ir: 'ADD 3', acc: 2, x: '?', pos: 'cpu', cell: 1, hot: 'cpu' },
    { t: ['<b>Execute</b>: ADD 3 makes the ALU compute 2 + 3. ACC is now 5.', '<b>Execute</b>: الأمر ADD 3 بيخلي الـ ALU يحسب 2 + 3. الـ ACC بقى 5.'], ir: 'ADD 3', acc: 5, x: '?', pos: 'cpu', cell: 1, hot: 'cpu' },
    { t: ['<b>Fetch</b> the last instruction: STORE x.', '<b>Fetch</b> آخر أمر: STORE x.'], ir: 'STORE x', acc: 5, x: '?', pos: 'cpu', cell: 2, hot: 'cpu' },
    { t: ['<b>Execute</b>: the result 5 travels back to RAM and is saved in x. One tiny program = three full cycles.', '<b>Execute</b>: النتيجة 5 بترجع للـ RAM وبتتحفظ في x. برنامج صغير = 3 دورات كاملة.'], ir: 'STORE x', acc: 5, x: '5', pos: 'ram', cell: 3, hot: 'ram' },
  ];
  stepper(host, S.length, i => {
    const s = S[i];
    q('rIR').textContent = s.ir; q('rACC').textContent = s.acc; q('vx').textContent = s.x;
    q('pkt').className = 'pkt at-' + s.pos;
    q('cpuB').classList.toggle('hot', s.hot === 'cpu'); q('ramB').classList.toggle('hot', s.hot === 'ram');
    stage.querySelectorAll('.ram-box .cell').forEach((c, k) => c.classList.toggle('act', k === s.cell));
    return s.t;
  });
}

/* ---------- Chapter 4: bits (interactive) ---------- */
function bits(host) {
  const stage = $('div', 'stage bits');
  const row = $('div', 'bit-row');
  const vals = [128, 64, 32, 16, 8, 4, 2, 1];
  const state = [0, 1, 0, 0, 0, 0, 0, 1];
  const btns = vals.map((v, k) => { const b = $('button', 'bit'); b.type = 'button'; b.innerHTML = '<small>' + v + '</small><span>0</span>'; b.onclick = () => { state[k] ^= 1; draw(); }; row.append(b); return b; });
  const out = $('div', 'bit-out');
  const presets = $('div', 'bit-presets');
  [['A', 65], ['a', 97], ['Z', 90], ['0', 48], ['255', 255], ['Clear', 0]].forEach(([l, n]) => { const b = $('button', 'btn ghost sm', l); b.type = 'button'; b.onclick = () => { vals.forEach((v, k) => { state[k] = (n & v) ? 1 : 0; }); draw(); }; presets.append(b); });
  const cap = captionBox();
  stage.append(row, out); host.append(stage, presets, cap);
  function draw() {
    const n = vals.reduce((a, v, k) => a + state[k] * v, 0);
    btns.forEach((b, k) => { b.classList.toggle('on', !!state[k]); b.lastChild.textContent = state[k]; });
    const ch = n >= 33 && n <= 126 ? String.fromCharCode(n) : '·';
    out.innerHTML = '<div><small>binary</small><b>' + state.join('') + '</b></div><div><small>decimal</small><b>' + n + '</b></div><div><small>hex</small><b>0x' + n.toString(16).toUpperCase().padStart(2, '0') + '</b></div><div><small>ASCII char</small><b>' + esc(ch) + '</b></div>';
    const terms = vals.filter((v, k) => state[k]);
    cap.set([terms.length ? 'Add the place values that are ON: <b>' + terms.join(' + ') + ' = ' + n + '</b>. Click the bits, or try the presets (65 is the letter A).' : 'All bits are 0, so the number is <b>0</b>. Click a bit to turn it on.',
      terms.length ? 'اجمع قيم الخانات اللي <b>ON</b>: <b>' + terms.join(' + ') + ' = ' + n + '</b>. اضغط على الـ bits أو جرّب الأزرار الجاهزة (الرقم 65 هو الحرف A).' : 'كل الـ bits بـ 0 يعني الرقم <b>0</b>. اضغط على bit عشان تشغّله.']);
  }
  draw();
}

/* ---------- Chapter 5: round-robin scheduler ---------- */
function scheduler(host) {
  const P = [{ n: 'Browser', c: 'c1' }, { n: 'Music', c: 'c2' }, { n: 'Editor', c: 'c3' }];
  const need = 3;
  const stage = $('div', 'stage sch');
  stage.innerHTML = '<div class="sch-cpu"><small>CPU</small><b id="who">idle</b></div><div class="sch-procs"></div><div class="sch-tl"></div>';
  const procs = stage.querySelector('.sch-procs'), tl = stage.querySelector('.sch-tl');
  const bars = P.map(p => { const d = $('div', 'sch-p ' + p.c, '<span>' + p.n + '</span><div class="bar"><i></i></div>'); procs.append(d); return d; });
  const slots = []; for (let k = 0; k < 9; k++) { const s = $('div', 'slot'); tl.append(s); slots.push(s); }
  host.append(stage);
  stepper(host, 10, i => {
    const done = [0, 0, 0];
    for (let k = 0; k < i; k++) done[k % 3]++;
    bars.forEach((b, k) => { b.querySelector('i').style.width = (done[k] / need * 100) + '%'; b.classList.toggle('run', i > 0 && (i - 1) % 3 === k && i <= 9); });
    slots.forEach((s, k) => { s.className = 'slot' + (k < i ? ' ' + P[k % 3].c + ' full' : ''); s.textContent = k < i ? P[k % 3].n[0] : ''; });
    stage.querySelector('#who').textContent = i === 0 ? 'idle' : (i > 9 ? 'idle' : P[(i - 1) % 3].n);
    if (i === 0) return ['Three programs are open. They all want the CPU, but there is only one CPU core.', 'تلات برامج مفتوحة. كلهم عايزين الـ CPU، لكن فيه core واحد بس.'];
    if (i === 9) return ['Everyone got three time slices and finished. Switching so fast makes it <b>look</b> like they ran together — that is multitasking.', 'كل واحد خد 3 time slices وخلّص. التبديل السريع ده بيخلي الشكل إنهم شغالين مع بعض — ده الـ multitasking.'];
    return ['Time slice ' + i + ': the OS gives the CPU to <b>' + P[(i - 1) % 3].n + '</b> for a very short moment, then switches to the next process.', 'Time slice رقم ' + i + ': نظام التشغيل بيدّي الـ CPU لـ <b>' + P[(i - 1) % 3].n + '</b> لحظة صغيرة جدًا وبعدين بيبدّل للـ process اللي بعدها.'];
  }, { ms: 1100 });
}

/* ---------- generic code tracer ---------- */
function tracer(host, cfg) {
  let cur = cfg.variants ? cfg.variants[0] : cfg;
  const vbar = $('div', 'variants');
  const stage = $('div', 'stage trace');
  const codeBox = $('div', 'tr-code'), side = $('div', 'tr-side');
  const vars = $('div', 'tr-vars'), con = $('div', 'tr-con');
  side.append(vars, con); stage.append(codeBox, side);
  if (cfg.variants) {
    cfg.variants.forEach((v, k) => { const b = $('button', 'btn ghost sm' + (k === 0 ? ' on' : ''), v.label); b.type = 'button'; b.onclick = () => { cur = v; [...vbar.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); ctl.stop(); build(); ctl.go(0); }; vbar.append(b); });
    host.append(vbar);
  }
  host.append(stage);
  const prev = {};
  function build() {
    codeBox.innerHTML = '';
    cur.code.forEach((l, k) => {
      const tag = cur.tags && cur.tags[k] ? '<em class="tag ' + cur.tags[k].toLowerCase() + '">' + cur.tags[k] + '</em>' : '';
      const d = $('div', 'tr-line', '<i>' + (k + 1) + '</i><code>' + esc(l) + '</code>' + tag); codeBox.append(d);
    });
    Object.keys(prev).forEach(k => delete prev[k]);
  }
  build();
  // dots/stepper use max frame count among variants; guard in render
  const n = Math.max(...(cfg.variants || [cfg]).map(v => v.frames.length));
  const ctl = stepper(host, n, i => {
    const f = cur.frames[Math.min(i, cur.frames.length - 1)];
    [...codeBox.children].forEach((d, k) => d.classList.toggle('act', k === f.line));
    const keys = Object.keys(f.vars || {});
    vars.innerHTML = keys.length ? keys.map(k => { const ch = prev[k] !== undefined && prev[k] !== f.vars[k]; return '<div class="v' + (ch ? ' ch' : '') + '"><small>' + esc(k) + '</small><b>' + esc(f.vars[k]) + '</b></div>'; }).join('') : '<div class="v none"><small>memory</small><b>—</b></div>';
    keys.forEach(k => { prev[k] = f.vars[k]; });
    con.innerHTML = '<small>console</small><pre>' + esc(f.out || '') + '<span class="cur"></span></pre>';
    if (cfg.hideVars) vars.style.display = 'none';
    return f.note;
  }, { ms: cfg.ms || 1700 });
  const origGo = ctl.go;
  return ctl;
}

function callstack(host) {
  const stage = $('div', 'stage cs');
  stage.innerHTML = '<div class="cs-code"><code>int factorial(int n) {<br>&nbsp;&nbsp;if (n &lt;= 1) return 1;<br>&nbsp;&nbsp;return n * factorial(n - 1);<br>}</code><div class="cs-call">factorial(4)</div></div><div class="cs-stack"></div><div class="cs-ret"></div>';
  const stack = stage.querySelector('.cs-stack'), ret = stage.querySelector('.cs-ret');
  host.append(stage);
  const frames = [4, 3, 2, 1].map(n => { const d = $('div', 'fr'); d.innerHTML = '<b>factorial(' + n + ')</b><span>n = ' + n + '</span><em></em>'; stack.append(d); return d; });
  const vals = { 1: 1, 2: 2, 3: 6, 4: 24 };
  stepper(host, 8, i => {
    const pushed = Math.min(i, 3) + 1;
    const popped = i >= 4 ? i - 3 : 0;
    const alive = pushed - popped;
    frames.forEach((f, k) => {
      const isAlive = k < alive, isTop = isAlive && k === alive - 1, n = 4 - k;
      f.classList.toggle('in', isAlive); f.classList.toggle('top', isTop);
      let em = '';
      if (isAlive) {
        if (i >= 4 && isTop) em = 'got ' + vals[n - 1] + ' → ' + n + ' × ' + vals[n - 1] + ' = ' + vals[n];
        else if (i < 4 && isTop) em = n === 1 ? 'base case: returns 1' : 'calls factorial(' + (n - 1) + ')';
        else em = 'waiting for factorial(' + (n - 1) + ')';
      }
      f.querySelector('em').textContent = em;
    });
    ret.textContent = i >= 4 ? 'factorial(' + (i - 3) + ') returns ' + vals[i - 3] : '';
    ret.className = 'cs-ret' + (i >= 4 ? ' on' : '');
    if (i < 3) return ['factorial(' + (4 - i) + ') is called. It cannot finish yet, because it needs factorial(' + (3 - i) + ') first — so its frame waits on the stack.', 'بيتنادى factorial(' + (4 - i) + '). مش هتقدر تخلص دلوقتي لأنها محتاجة factorial(' + (3 - i) + ') الأول — فالـ frame بتاعها بيستنى في الـ stack.'];
    if (i === 3) return ['factorial(1) hits the <b>base case</b> (n <= 1) and can return 1 right away. The stack is as tall as it gets.', 'factorial(1) وصلت للـ <b>base case</b> (n <= 1) وتقدر ترجّع 1 على طول. الـ stack وصل لأقصى ارتفاع.'];
    return i === 7 ? ['factorial(4) = 4 × 6 = <b>24</b>. The stack is empty and the answer goes back to main.', 'factorial(4) = 4 × 6 = <b>24</b>. الـ stack فضي والإجابة بترجع لـ main.']
      : ['factorial(' + (i - 3) + ') returns <b>' + vals[i - 3] + '</b> to the frame below it, and its own frame disappears.', 'factorial(' + (i - 3) + ') بترجّع <b>' + vals[i - 3] + '</b> للـ frame اللي تحتها، والـ frame بتاعها بتختفي.'];
  }, { ms: 1700 });
}

/* ---------- Chapter 7: stack & queue (interactive) ---------- */
function stackqueue(host) {
  const stage = $('div', 'stage sq');
  const st = [], qu = []; let counter = 1;
  const A = $('div', 'sq-box', '<h4>Stack <small>LIFO</small></h4><div class="sq-stack"></div><div class="sq-btns"></div>');
  const B = $('div', 'sq-box', '<h4>Queue <small>FIFO</small></h4><div class="sq-queue"></div><div class="sq-btns"></div>');
  const cap = captionBox();
  const mk = (box, label, fn) => { const b = $('button', 'btn ghost sm', label); b.type = 'button'; b.onclick = fn; box.querySelector('.sq-btns').append(b); };
  const SS = A.querySelector('.sq-stack'), QQ = B.querySelector('.sq-queue');
  const draw = (msg) => {
    SS.innerHTML = st.map((v, k) => '<div class="it' + (k === st.length - 1 ? ' top' : '') + '">' + v + '</div>').join('') || '<span class="empty">empty</span>';
    QQ.innerHTML = qu.map((v, k) => '<div class="it' + (k === 0 ? ' front' : '') + '">' + v + '</div>').join('') || '<span class="empty">empty</span>';
    if (msg) cap.set(msg);
  };
  mk(A, 'push', () => { if (st.length >= 6) return; st.push(counter++); draw(['<b>push</b>: the new item goes on <b>top</b> of the stack.', '<b>push</b>: العنصر الجديد بيتحط <b>فوق</b> الـ stack.']); });
  mk(A, 'pop', () => { if (!st.length) return draw(['The stack is empty — nothing to pop.', 'الـ stack فاضي — مفيش حاجة تتشال.']); const v = st.pop(); draw(['<b>pop</b>: removes the <b>last</b> item added (' + v + ') — Last-In, First-Out.', '<b>pop</b>: بيشيل <b>آخر</b> عنصر اتضاف (' + v + ') — Last-In, First-Out.']); });
  mk(B, 'enqueue', () => { if (qu.length >= 6) return; qu.push(counter++); draw(['<b>enqueue</b>: the new item joins the <b>back</b> of the line.', '<b>enqueue</b>: العنصر الجديد بينضم <b>لآخر</b> الطابور.']); });
  mk(B, 'dequeue', () => { if (!qu.length) return draw(['The queue is empty — nobody to serve.', 'الطابور فاضي — مفيش حد يتخدم.']); const v = qu.shift(); draw(['<b>dequeue</b>: removes the <b>first</b> item that arrived (' + v + ') — First-In, First-Out.', '<b>dequeue</b>: بيشيل <b>أول</b> عنصر وصل (' + v + ') — First-In, First-Out.']); });
  stage.append(A, B); host.append(stage, cap);
  [1, 2, 3].forEach(() => { st.push(counter); qu.push(counter); counter++; });
  draw(['Press the buttons. Both structures hold the same items 1, 2, 3 — watch which one leaves first.', 'اضغط على الأزرار. الاتنين ماسكين نفس العناصر 1 و 2 و 3 — شوف أنهي واحد بيخرج الأول.']);
}

/* ---------- Chapter 8: packets ---------- */
function packets(host) {
  const stage = $('div', 'stage net');
  const nodes = ['You', 'Router A', 'Router B', 'Server'];
  stage.innerHTML = '<div class="net-line"></div>' + nodes.map((n, k) => '<div class="node n' + k + '"><i></i><span>' + n + '</span></div>').join('') + '<div class="net-dns"></div><div class="net-msg"></div>';
  const pk = [1, 2, 3, 4].map(n => { const p = $('div', 'pk p' + n, '' + n); stage.append(p); return p; });
  host.append(stage);
  const dns = stage.querySelector('.net-dns'), msg = stage.querySelector('.net-msg');
  const X = [8, 36, 64, 92];
  const S = [
    { t: ['<b>DNS</b>: your browser asks the Domain Name System to turn <b>example.com</b> into an IP address (like 93.184.216.34).', '<b>DNS</b>: المتصفح بيسأل الـ Domain Name System يحوّل <b>example.com</b> لعنوان IP (زي 93.184.216.34).'], at: 0, dns: 'example.com → 93.184.216.34' },
    { t: ['Your message is split into small <b>packets</b>, each with a number and the destination IP.', 'رسالتك بتتقسّم لـ <b>packets</b> صغيرة، كل واحدة ليها رقم وعنوان الـ IP للوجهة.'], at: 0 },
    { t: ['The packets leave your device and reach the first <b>router</b>.', 'الـ packets بتسيب جهازك وبتوصل لأول <b>router</b>.'], at: 1 },
    { t: ['Each router forwards the packets toward the destination. They may even take different routes.', 'كل router بيوجّه الـ packets ناحية الوجهة. وممكن حتى تاخد طرق مختلفة.'], at: 2 },
    { t: ['The packets arrive at the <b>server</b>, maybe in a different order.', 'الـ packets بتوصل للـ <b>server</b>، وممكن بترتيب مختلف.'], at: 3, shuffle: true },
    { t: ['The server puts them back in order using their numbers and reads the complete request (HTTP or HTTPS). Then it replies the same way.', 'الـ server بيرجّعهم لترتيبهم باستخدام أرقامهم وبيقرأ الطلب كامل (HTTP أو HTTPS). وبعدين بيرد بنفس الطريقة.'], at: 3, done: true },
  ];
  stepper(host, S.length, i => {
    const s = S[i];
    dns.textContent = s.dns || ''; dns.classList.toggle('on', !!s.dns);
    const order = s.shuffle ? [2, 0, 3, 1] : [0, 1, 2, 3];
    pk.forEach((p, k) => {
      const slot = order.indexOf(k);
      p.style.left = (X[s.at] + (s.at === 0 && i === 0 ? 0 : 0)) + '%';
      p.style.top = (62 + slot * 0) + 'px';
      p.style.transform = 'translate(' + ((slot - 1.5) * 26 - 12) + 'px, ' + (s.at === 3 ? (s.done ? -40 : 0) : 0) + 'px)';
      p.classList.toggle('hide', i === 0);
      p.classList.toggle('sorted', !!s.done);
    });
    msg.textContent = s.done ? '1 2 3 4 → full message' : '';
    msg.classList.toggle('on', !!s.done);
    stage.querySelectorAll('.node').forEach((n, k) => n.classList.toggle('act', k === s.at));
    return s.t;
  }, { ms: 1900 });
}

<script>(function () {
'use strict';
const CH = CONTENT.CHAPTERS, TASKS = EXAMS.TASKS, MCQ = EXAMS.MCQ;
const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = document.getElementById('app');

/* ------------------------------------------------ progress store */
const mem = {};
const store = {
  all() { try { return JSON.parse(localStorage.getItem('cpplab.done') || '{}'); } catch (e) { return Object.assign({}, mem); } },
  has(k) { return !!this.all()[k]; },
  add(k) { const d = this.all(); d[k] = 1; mem[k] = 1; try { localStorage.setItem('cpplab.done', JSON.stringify(d)); } catch (e) { } refreshProgress(); },
};
const itemsOf = n => TASKS.filter(t => t.ch === n).map(t => 't:' + t.id).concat(MCQ[n] ? ['q:' + n] : []);
const chDone = n => itemsOf(n).filter(k => store.has(k)).length;
function totals() { let d = 0, t = 0; CH.forEach(c => { d += chDone(c.n); t += itemsOf(c.n).length; }); return { d, t }; }
function refreshProgress() {
  const { d, t } = totals();
  const b = document.querySelector('.pill .bar i'), l = document.querySelector('.pill .lbl');
  if (b) b.style.width = (t ? d / t * 100 : 0) + '%';
  if (l) l.textContent = d + ' / ' + t + ' done';
}

/* ------------------------------------------------ syntax highlight */
const KW = new Set('if else for while do switch case default break continue return const static inline using namespace true false sizeof new delete struct class enum void'.split(' '));
const TY = new Set('int float double char bool string long short unsigned signed auto'.split(' '));
function highlight(src) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])+')|(#[a-z]+(?:[ \t]*<[^>\n]*>)?)|\b(\d+\.?\d*(?:[eE][+-]?\d+)?[fFlL]?)\b|\b([A-Za-z_]\w*)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += '<span class="tk-c">' + t + '</span>';
    else if (m[2]) out += '<span class="tk-s">' + t + '</span>';
    else if (m[3]) out += '<span class="tk-p">' + t + '</span>';
    else if (m[4]) out += '<span class="tk-n">' + t + '</span>';
    else {
      const w = m[5];
      if (KW.has(w)) out += '<span class="tk-k">' + t + '</span>';
      else if (TY.has(w)) out += '<span class="tk-t">' + t + '</span>';
      else if (/^\s*\(/.test(src.slice(m.index + w.length, m.index + w.length + 3))) out += '<span class="tk-f">' + t + '</span>';
      else out += t;
    }
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}

/* ------------------------------------------------ error text */
function kindLabel(k) {
  return ({
    syntax: ['Compile error — syntax', 'خطأ compile — في السينتاكس'], compile: ['Compile error', 'خطأ compile'], runtime: ['Runtime error — the program crashed', 'خطأ وقت التشغيل — البرنامج وقع'],
    timeout: ['The program never finished', 'البرنامج ماخلصش أبدًا'], input: ['Input problem', 'مشكلة في المدخلات'], unsupported: ['Not supported by this checker', 'مش مدعوم في الفاحص ده'], internal: ['Checker problem', 'مشكلة في الفاحص'],
  })[k] || ['Error', 'خطأ'];
}
function errHTML(e) {

}

/* ------------------------------------------------ code block (lesson samples) */
function codeBlock(src, note) {
  const box = $('div', 'cb');

  bRun.onclick = () => {

  };
  const wrap = $('div'); wrap.append(box);
  if (note) { wrap.append($('p', 'note', esc(note[0]))); const a = $('p', 'note-ar', esc(note[1])); a.dir = 'rtl'; wrap.append(a); }
  return wrap;

/* ------------------------------------------------ editor with highlighting */
function createEditor(initial) {
  const root = $('div', 'ed');
  const gut = $('div', 'gut'), stack = $('div', 'stack');
  const pre = $('pre', 'hl'); pre.setAttribute('aria-hidden', 'true');
  const codeEl = $('code'); const bar = $('div', 'errbar');
  pre.append(codeEl, bar);
  const ta = $('textarea'); ta.spellcheck = false; ta.setAttribute('autocapitalize', 'off'); ta.setAttribute('autocorrect', 'off'); ta.setAttribute('autocomplete', 'off'); ta.setAttribute('aria-label', 'C++ code editor'); ta.wrap = 'off';
  stack.append(pre, ta); root.append(gut, stack);
  const draw = () => {
    const v = ta.value;
    codeEl.innerHTML = highlight(v) + '\n ';
    const n = v.split('\n').length; let g = ''; for (let i = 1; i <= n; i++) g += i + '\n'; gut.textContent = g;
    bar.style.display = 'none';
  };
  const sync = () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; gut.scrollTop = ta.scrollTop; };
  ta.addEventListener('input', draw);
  ta.addEventListener('scroll', sync);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart, en = ta.selectionEnd; ta.setRangeText('    ', s, en, 'end'); draw(); }
    else if (e.key === 'Enter') {
      const s = ta.selectionStart, v = ta.value; const ls = v.lastIndexOf('\n', s - 1) + 1; const line = v.slice(ls, s);
      let ind = (/^\s*/.exec(line) || [''])[0];
      const extra = /\{\s*$/.test(line) ? '    ' : '';
      e.preventDefault(); ta.setRangeText('\n' + ind + extra, s, ta.selectionEnd, 'end'); draw(); sync();
    }
  });
  ta.value = initial; draw();
  return {
    el: root, get: () => ta.value, set: v => { ta.value = v; draw(); ta.scrollTop = 0; sync(); },
    mark(line) { if (line > 0) { bar.style.top = (14 + (line - 1) * 22) + 'px'; bar.style.display = 'block'; } },
    focus: () => ta.focus(),
  };
}

/* ------------------------------------------------ exam */

    h += '<ul class="reqs">' + res.reqs.map(r => '<li class="' + (r.ok ? 'yes' : 'no') + '"><b>' + (r.ok ? '✓' : '✗') + '</b><div>' + esc(r.en) + '<span>' + esc(r.ar) + '</span></div></li>').join('') + '</ul>';

  const chips = $('div', 'chips'); const card = $('div', 'task');
